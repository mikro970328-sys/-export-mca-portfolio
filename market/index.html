<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercancía disponible · Export MCA</title>
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f5f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:22px 18px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.brand{font-size:22px;font-weight:800}.sub{color:#c7d4e8;margin-top:4px}.hero{padding:42px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(6,32,74,.06)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3ff;color:var(--navy);font-size:12px;font-weight:800}.qty{font-size:25px;font-weight:800;color:var(--navy);margin:12px 0}.muted{color:var(--muted);font-size:13px}.facts{display:grid;gap:8px;margin:14px 0}.fact{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:7px}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}.empty{text-align:center;padding:45px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:18px}.modal.hidden{display:none}.box{background:#fff;border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:9px;font:inherit}textarea{min-height:90px}.row{display:flex;gap:9px;margin-top:14px}.row button{flex:1}.alt{background:#fff!important;color:var(--navy)!important;border:1px solid var(--navy)!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">EXPORT MCA</div><div class="sub">Mercancía disponible y próximos embarques</div></div></header>
<main class="wrap"><section class="hero"><h1>Mercancía disponible</h1><p>Consulte productos disponibles, fechas estimadas de salida y llegada.</p></section><section id="listings" class="grid"></section></main>
<div id="modal" class="modal hidden"><div class="box"><h2>Solicitar cotización</h2><div id="selected" class="muted"></div><label>Nombre *</label><input id="name"><label>Empresa</label><input id="company"><label>WhatsApp *</label><input id="phone" placeholder="+1..."><label>Correo</label><input id="email"><label>Cantidad solicitada</label><input id="quantity" type="number" min="0" step="any"><label>Mensaje</label><textarea id="message"></textarea><div id="formMsg" class="muted"></div><div class="row"><button id="close" class="btn alt">Cancelar</button><button id="send" class="btn">Enviar solicitud</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let selected=null;const fmt=v=>v?new Date(v).toLocaleDateString('es-US',{dateStyle:'medium'}):'Por confirmar';const labels={coming_soon:'Próximamente',available:'Disponible',limited:'Últimas unidades',reserved:'Reservado',sold_out:'Agotado'};
function openLead(item){selected=item;$('selected').textContent=item.product_name;$('modal').classList.remove('hidden')}
async function load(){try{const r=await fetch('/api/public-marketplace');const d=await r.json();if(!r.ok)throw new Error(d.error);const items=d.listings||[];$('listings').innerHTML=items.length?items.map((x,i)=>`<article class="card"><span class="badge">${labels[x.availability_status]||x.availability_status}</span><h2>${x.product_name}</h2><div class="muted">${[x.brand,x.specification].filter(Boolean).join(' · ')}</div><div class="qty">${x.available_quantity??'—'} ${x.unit||''}</div><div class="facts"><div class="fact"><span>Salida</span><strong>${fmt(x.estimated_departure_at)}</strong></div><div class="fact"><span>Llegada</span><strong>${fmt(x.estimated_arrival_at)}</strong></div><div class="fact"><span>Destino</span><strong>${x.destination_port||'Por confirmar'}</strong></div></div><p>${x.public_notes||''}</p><button class="btn" onclick="openLead(window.items[${i}])">Solicitar cotización</button></article>`).join(''):'<div class="card empty">No hay mercancía pública disponible en este momento.</div>';window.items=items}catch(e){$('listings').innerHTML='<div class="card empty">No se pudo cargar la mercancía disponible.</div>'}}
$('close').onclick=()=> $('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('send').onclick=async()=>{const payload={listing_id:selected?.id,customer_name:$('name').value,company:$('company').value,phone:$('phone').value,email:$('email').value,requested_quantity:$('quantity').value,message:$('message').value};$('formMsg').textContent='Enviando...';try{const r=await fetch('/api/public-marketplace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error);$('formMsg').textContent='Solicitud recibida. Export MCA se comunicará con usted.';setTimeout(()=>$('modal').classList.add('hidden'),1400)}catch(e){$('formMsg').textContent=e.message}};load();
</script>
</body></html>
