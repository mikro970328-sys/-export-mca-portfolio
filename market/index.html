<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercancía disponible · Export MCA</title>
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f5f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:22px 18px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.brand{font-size:22px;font-weight:800}.sub{color:#c7d4e8;margin-top:4px}.hero{padding:42px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(6,32,74,.06)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3ff;color:var(--navy);font-size:12px;font-weight:800}.qty{font-size:24px;font-weight:800;color:var(--navy);margin:12px 0}.muted{color:var(--muted);font-size:13px}.facts{display:grid;gap:8px;margin:14px 0}.fact{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:7px}.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.empty{text-align:center;padding:45px}.pic{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">EXPORT MCA</div><div class="sub">Mercancía disponible y próximos embarques</div></div></header>
<main class="wrap"><section class="hero"><h1>Mercancía disponible</h1><p>Consulte publicaciones comerciales vigentes y solicite una cotización directamente.</p></section><section id="listings" class="grid"></section></main>
<script>
const $=id=>document.getElementById(id);
const fmt=v=>v?new Date(v).toLocaleDateString('es-US',{dateStyle:'medium'}):'Por confirmar';
const labels={available:'Disponible',limited:'Últimas unidades',reserved:'Reservado',unavailable:'No disponible',coming_soon:'Próximamente'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function quoteLink(item){
  const text=`Hola, estoy interesado en cotizar: ${item.title}${item.quantity?` · Cantidad publicada: ${item.quantity} ${item.unit||''}`:''}${item.price?` · Precio publicado: ${item.price} ${item.currency||'USD'}`:''}`;
  return `https://wa.me/17868000735?text=${encodeURIComponent(text)}`;
}
async function load(){
  try{
    const r=await fetch('/api/public/publications');
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'No se pudo consultar');
    const items=d.publications||[];
    $('listings').innerHTML=items.length?items.map(x=>`<article class="card">${x.image_urls?.[0]?`<img class="pic" src="${esc(x.image_urls[0])}" alt="${esc(x.title)}">`:''}<span class="badge">${esc(labels[x.availability_status]||x.availability_status||'Disponible')}</span><h2>${esc(x.title)}</h2><p>${esc(x.description||'')}</p>${x.quantity?`<div class="qty">${esc(x.quantity)} ${esc(x.unit||'')}</div>`:''}<div class="facts">${x.price?`<div class="fact"><span>Precio</span><strong>${esc(x.price)} ${esc(x.currency||'USD')}</strong></div>`:''}<div class="fact"><span>Salida</span><strong>${fmt(x.departure_date)}</strong></div><div class="fact"><span>Llegada</span><strong>${fmt(x.arrival_date)}</strong></div></div><a class="btn" href="${quoteLink(x)}" target="_blank" rel="noopener">Solicitar cotización</a></article>`).join(''):'<div class="card empty">No hay mercancía pública disponible en este momento.</div>';
  }catch(e){$('listings').innerHTML='<div class="card empty">No se pudo cargar la mercancía disponible.</div>'}
}
load();
</script>
</body></html>
