<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Export MCA LLC</title>
  <meta name="robots" content="noindex">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f7fb;color:#06204a}.box{text-align:center;padding:28px}.spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #dfe5ee;border-top-color:#f58220;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
  <script>
    (function(){
      var host=window.location.hostname.toLowerCase();
      var target='/index.html';
      if(host==='admin.exportmca.com') target='/admin/pwa.html';
      if(host==='app.exportmca.com') target='/app/pwa.html';
      window.location.replace(target);
    })();
  </script>
</head>
<body><div class="box"><div class="spinner"></div><strong>Abriendo Export MCA...</strong></div></body>
</html>
