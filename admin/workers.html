<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trabajadores · Export MCA</title>
<link rel="icon" href="/logo.png">
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f4f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37;--bad:#b42318;--shadow:0 12px 32px rgba(6,32,74,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(120deg,var(--navy),#0b2e63);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:145px;max-height:52px;object-fit:contain;background:#fff;border-radius:8px;padding:5px}.brand b{display:block}.brand small{color:#c7d4e8}main{width:min(1100px,calc(100% - 28px));margin:24px auto}.grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}h1,h2{color:var(--navy)}h1{margin:0;font-size:22px}h2{margin-top:0}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font:inherit}button,a.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}.orange{background:var(--orange)}.alt{background:#fff!important;color:var(--navy)!important;border:1px solid var(--navy)!important}.danger{background:#fff!important;color:var(--bad)!important;border:1px solid #efb0aa!important}.success{background:#fff!important;color:var(--ok)!important;border:1px solid #9bd3aa!important}.toolbar,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{justify-content:flex-start}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 7px;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf9f0;color:var(--ok);font-size:12px}.pill.off{background:#f2f4f7;color:var(--muted)}.msg{margin-top:10px;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}.brand img{display:none}}
</style>
</head>
<body>
<header><div class="brand"><img src="/logo.png" alt="Export MCA"><div><b>EXPORT MCA</b><small>Administración de trabajadores</small></div></div><div class="actions"><a class="btn alt" href="/admin/index.html">Volver al ERP</a><button id="logout" class="danger">Cerrar sesión</button></div></header>
<main><div class="toolbar"><div><h1>Trabajadores</h1><div style="color:var(--muted);font-size:13px">Guarda los contactos que luego podrás asignar a cada producto o publicación.</div></div><button id="refresh" class="alt">Actualizar</button></div>
<div class="grid" style="margin-top:18px"><section class="card"><h2 id="formTitle">Agregar trabajador</h2><input id="workerId" type="hidden"><label>Nombre completo *</label><input id="workerName" placeholder="Nombre del trabajador"><label>Teléfono / WhatsApp *</label><input id="workerPhone" placeholder="+1 305 555 1234"><div class="actions" style="margin-top:16px"><button id="saveWorker" class="orange">Guardar trabajador</button><button id="cancelEdit" class="alt" style="display:none">Cancelar</button></div><div id="workerMsg" class="msg"></div></section><section class="card"><h2>Trabajadores guardados</h2><div id="workersList">Cargando...</div></section></div></main>
<script>
const token=localStorage.getItem('export_mca_token')||'';const user=JSON.parse(localStorage.getItem('export_mca_user')||'null');let workers=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
if(!token||!user||user.role!=='master_admin')location.replace('/admin/index.html');
async function api(path,o={}){const r=await fetch(path,{...o,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function message(text,ok=false){$('workerMsg').textContent=text;$('workerMsg').className='msg '+(ok?'ok':'bad')}
function resetForm(){$('workerId').value='';$('workerName').value='';$('workerPhone').value='';$('formTitle').textContent='Agregar trabajador';$('saveWorker').textContent='Guardar trabajador';$('cancelEdit').style.display='none';message('')}
function render(){const root=$('workersList');if(!workers.length){root.innerHTML='<div class="empty">No hay trabajadores registrados.</div>';return}root.innerHTML=`<table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${workers.map(w=>`<tr><td><b>${esc(w.full_name)}</b></td><td>${esc(w.phone)}</td><td><span class="pill ${w.is_active?'':'off'}">${w.is_active?'Activo':'Inactivo'}</span></td><td><div class="actions"><button class="alt" onclick="editWorker('${w.id}')">Editar</button>${w.is_active?`<button class="danger" onclick="toggleWorker('${w.id}',false)">Desactivar</button>`:`<button class="success" onclick="toggleWorker('${w.id}',true)">Reactivar</button>`}</div></td></tr>`).join('')}</tbody></table>`}
async function load(){try{const r=await api('/api/workers');workers=r.workers||[];render()}catch(e){$('workersList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
window.editWorker=id=>{const w=workers.find(x=>x.id===id);if(!w)return;$('workerId').value=w.id;$('workerName').value=w.full_name;$('workerPhone').value=w.phone;$('formTitle').textContent='Editar trabajador';$('saveWorker').textContent='Guardar cambios';$('cancelEdit').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})};
window.toggleWorker=async(id,is_active)=>{if(!confirm(is_active?'¿Reactivar este trabajador?':'¿Desactivar este trabajador?'))return;try{await api('/api/workers',{method:'PATCH',body:JSON.stringify({id,is_active})});await load()}catch(e){alert(e.message)}};
$('saveWorker').onclick=async()=>{try{const id=$('workerId').value;const payload={full_name:$('workerName').value,phone:$('workerPhone').value};if(id)payload.id=id;await api('/api/workers',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});message(id?'Trabajador actualizado.':'Trabajador guardado.',true);resetForm();await load()}catch(e){message(e.message)}};
$('cancelEdit').onclick=resetForm;$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('export_mca_token');localStorage.removeItem('export_mca_user');location.replace('/admin/index.html')};load();
</script></body></html>
