<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario | Export MCA</title>
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f4f7fb;--line:#dde4ee;--text:#152238;--muted:#667085;--soft:#f8fafc;--ok:#117a37;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}.wrap{width:min(1240px,calc(100% - 24px));margin:16px auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1,h2{margin:0;color:var(--navy)}h1{font-size:26px}h2{font-size:18px}.muted{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.stat span{display:block;font-size:10px;text-transform:uppercase;font-weight:800;color:var(--muted)}.stat b{display:block;font-size:22px;color:var(--navy);margin-top:4px}.filters{display:grid;grid-template-columns:1fr 240px;gap:10px;margin-top:12px}input,select{width:100%;border:1px solid #ccd5e2;border-radius:8px;padding:9px 10px;font:inherit;font-size:13px}.inventory-row{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff}.inventory-head{display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(110px,.65fr)) 44px;gap:8px;align-items:center;padding:12px 14px;cursor:pointer}.product-name{font-weight:900;color:var(--navy)}.product-meta{font-size:11px;color:var(--muted);margin-top:3px}.metric span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.metric b{font-size:14px}.metric.available b{color:var(--ok)}.metric.reserved b{color:var(--warn)}.chev{font-size:18px;text-align:center;color:var(--navy)}.source-wrap{display:none;border-top:1px solid var(--line);padding:10px 14px 14px;background:var(--soft)}.inventory-row.open .source-wrap{display:block}.inventory-row.open .chev{transform:rotate(180deg)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);font-size:11px}th{font-size:9px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf3ff;color:var(--navy);font-size:9px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px}.source-mobile{display:none}.legend{font-size:11px;color:var(--muted);margin-top:7px}
@media(max-width:760px){.wrap{width:calc(100% - 12px);margin:8px auto}.card{padding:13px}.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.inventory-head{grid-template-columns:1fr 32px}.inventory-head>.metric{display:none}.product-name{font-size:15px}.source-desktop{display:none}.source-mobile{display:block}.source-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;margin-top:8px}.source-card-top{display:flex;justify-content:space-between;gap:10px}.source-card b{color:var(--navy)}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.source-grid div{background:var(--soft);border-radius:7px;padding:7px}.source-grid span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.source-grid strong{font-size:12px}.mobile-summary{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.mobile-summary div{background:var(--soft);border-radius:8px;padding:7px}.mobile-summary span{font-size:8px;text-transform:uppercase;color:var(--muted);display:block;font-weight:800}.mobile-summary b{font-size:11px}.inventory-head{align-items:start}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="toolbar"><div><h1>Inventario</h1><div class="muted">Existencias por almacén, producto y WR de origen.</div></div></div>
    <div class="filters"><input id="search" placeholder="Buscar producto, SKU, marca, WR o almacén"><select id="warehouseFilter"><option value="">Todos los almacenes</option></select></div>
    <div class="legend">Disponible = físico − reservado. Las recepciones anuladas no forman parte del inventario.</div>
  </section>
  <div id="stats" class="stats"></div>
  <section class="card"><div class="toolbar"><div><h2>Existencias</h2><div class="muted">Toca un producto para ver de qué WR proviene.</div></div></div><div id="inventoryList"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const token=localStorage.getItem('export_mca_token')||'';if(!token)location.href='/admin/index.html';let inventory=[],warehouses=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:3}):'0'};
async function api(){const r=await fetch('/api/inventory',{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('export_mca_token');location.href='/admin/index.html';throw new Error('Sesión vencida')}if(!r.ok)throw new Error(d.error||'No se pudo cargar inventario');return d}
function unit(row){return row.unit||row.product?.unit||'unidades'}
function qtyText(q,p,u){const bits=[];if(Number(p||0)>0)bits.push(`${num(p)} pallets`);if(Number(q||0)>0)bits.push(`${num(q)} ${esc(u)}`);return bits.join(' · ')||'0'}
function renderStats(){const rows=filtered();const uniqueProducts=new Set(rows.map(r=>r.product_id)).size;const physical=rows.reduce((s,r)=>s+Number(r.physical_pallets||0),0),reserved=rows.reduce((s,r)=>s+Number(r.reserved_pallets||0),0),available=rows.reduce((s,r)=>s+Number(r.available_pallets||0),0);$('stats').innerHTML=`<div class="stat"><span>Productos</span><b>${uniqueProducts}</b></div><div class="stat"><span>Pallets físicos</span><b>${num(physical)}</b></div><div class="stat"><span>Pallets reservados</span><b>${num(reserved)}</b></div><div class="stat"><span>Pallets disponibles</span><b>${num(available)}</b></div>`}
function filtered(){const q=$('search').value.trim().toLowerCase(),wid=$('warehouseFilter').value;return inventory.filter(r=>{if(wid&&r.warehouse_id!==wid)return false;if(!q)return true;const text=[r.product?.sku,r.product?.name,r.product?.brand,r.warehouse?.code,r.warehouse?.name,...(r.sources||[]).map(s=>s.receipt_number)].join(' ').toLowerCase();return text.includes(q)})}
function sourceDesktop(s,u){return `<tr><td><b>${esc(s.receipt_number)}</b></td><td>${esc(s.lot_number||'-')}</td><td>${qtyText(s.physical_quantity,s.physical_pallets,u)}</td><td>${qtyText(s.reserved_quantity,s.reserved_pallets,u)}</td><td><b>${qtyText(s.available_quantity,s.available_pallets,u)}</b></td><td>${s.units_per_pallet?num(s.units_per_pallet):'-'}</td></tr>`}
function sourceMobile(s,u){return `<div class="source-card"><div class="source-card-top"><div><b>${esc(s.receipt_number)}</b><div class="muted">${s.lot_number?'Lote '+esc(s.lot_number):'Sin lote'}</div></div><span class="pill">Origen WR</span></div><div class="source-grid"><div><span>Físico</span><strong>${qtyText(s.physical_quantity,s.physical_pallets,u)}</strong></div><div><span>Disponible</span><strong>${qtyText(s.available_quantity,s.available_pallets,u)}</strong></div><div><span>Reservado</span><strong>${qtyText(s.reserved_quantity,s.reserved_pallets,u)}</strong></div><div><span>Unid./pallet</span><strong>${s.units_per_pallet?num(s.units_per_pallet):'-'}</strong></div></div></div>`}
function render(){renderStats();const rows=filtered();if(!rows.length){$('inventoryList').innerHTML='<div class="empty">No hay inventario que coincida.</div>';return}$('inventoryList').innerHTML=rows.map((r,i)=>{const u=unit(r);return `<article class="inventory-row" data-index="${i}"><div class="inventory-head"><div><div class="product-name">${esc(r.product?.name||'Producto')}</div><div class="product-meta">${esc(r.product?.sku||'Sin SKU')} · ${esc(r.warehouse?.code||'')} ${esc(r.warehouse?.name||'')} · ${r.source_count} WR</div><div class="mobile-summary"><div><span>Físico</span><b>${qtyText(r.physical_quantity,r.physical_pallets,u)}</b></div><div><span>Reservado</span><b>${qtyText(r.reserved_quantity,r.reserved_pallets,u)}</b></div><div><span>Disponible</span><b>${qtyText(r.available_quantity,r.available_pallets,u)}</b></div></div></div><div class="metric"><span>Físico</span><b>${qtyText(r.physical_quantity,r.physical_pallets,u)}</b></div><div class="metric reserved"><span>Reservado</span><b>${qtyText(r.reserved_quantity,r.reserved_pallets,u)}</b></div><div class="metric available"><span>Disponible</span><b>${qtyText(r.available_quantity,r.available_pallets,u)}</b></div><div class="chev">⌄</div></div><div class="source-wrap"><div class="source-desktop"><table><thead><tr><th>WR origen</th><th>Lote</th><th>Físico</th><th>Reservado</th><th>Disponible</th><th>Unid./pallet</th></tr></thead><tbody>${(r.sources||[]).map(s=>sourceDesktop(s,u)).join('')}</tbody></table></div><div class="source-mobile">${(r.sources||[]).map(s=>sourceMobile(s,u)).join('')}</div></div></article>`}).join('');document.querySelectorAll('.inventory-head').forEach(head=>head.onclick=()=>head.closest('.inventory-row').classList.toggle('open'))}
async function load(){const d=await api();inventory=d.inventory||[];warehouses=d.warehouses||[];$('warehouseFilter').innerHTML='<option value="">Todos los almacenes</option>'+warehouses.filter(w=>w.active).map(w=>`<option value="${w.id}">${esc(w.code)} · ${esc(w.name)}</option>`).join('');render()}
$('search').oninput=render;$('warehouseFilter').onchange=render;load().catch(e=>$('inventoryList').innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script>
</body>
</html>
