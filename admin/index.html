<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export MCA Tracking</title><style>:root{--navy:#06204a;--orange:#f58220;--bg:#f5f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37;--bad:#b42318;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{width:min(1200px,calc(100% - 28px));margin:24px auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 8px 20px rgba(6,32,74,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.stat b{display:block;font-size:24px;color:var(--navy)}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.orange{background:var(--orange)}button.danger{background:#fff;color:var(--bad);border:1px solid #efb0aa}button.success{background:#fff;color:var(--ok);border:1px solid #9bd3aa}.hidden{display:none}.toolbar,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.search{flex:1;min-width:260px}.tabs{display:flex;gap:8px}.tab{background:#fff;color:var(--navy);border:1px solid var(--line)}.tab.active{background:var(--navy);color:#fff}.alerts{display:flex;gap:10px;flex-wrap:wrap}.alert{padding:10px 12px;border-radius:8px;background:#fff8e8;border:1px solid #f3d59c;color:#7a4b00}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf3ff;color:var(--navy);font-size:12px}.done{background:#edf9f0;color:var(--ok)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 7px;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;max-width:700px;width:100%;max-height:85vh;overflow:auto;border-radius:12px;padding:20px}.timeline{border-left:3px solid var(--line);margin-left:8px;padding-left:16px}.event{margin:0 0 16px}.muted{color:var(--muted);font-size:12px}.msg{margin-top:8px;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header><b>EXPORT MCA · CRM Logístico</b><button id="logout" class="alt hidden">Salir</button></header><main><section id="loginCard" class="card" style="max-width:430px;margin:60px auto"><h2>Acceso privado</h2><label>Contraseña</label><input id="password" type="password"><div style="margin-top:14px"><button id="login">Entrar</button></div><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><div class="toolbar"><div><h2 style="margin:0">Buscar operaciones</h2><div class="muted">Busca antes de crear o modificar registros.</div></div><div class="row"><button id="exportCsv" class="orange">Exportar CSV</button><button id="refresh" class="alt">Actualizar</button></div></div><div class="toolbar" style="margin-top:14px"><input id="shipmentSearch" class="search" placeholder="Cliente, contenedor, teléfono, booking, B/L, naviera o producto"><div class="tabs"><button class="tab active" data-filter="active">Activos</button><button class="tab" data-filter="delivered">Entregados</button><button class="tab" data-filter="all">Todos</button></div></div></section><section id="stats" class="stats"></section><section class="card"><h3>Alertas operativas</h3><div id="alerts" class="alerts"></div></section><section class="card"><h2>Contenedores</h2><div id="shipments"></div></section><div class="grid"><section class="card"><h2>Nuevo cliente</h2><label>Nombre *</label><input id="clientName"><label>Empresa</label><input id="clientCompany"><label>WhatsApp *</label><input id="clientPhone" placeholder="+5351234567"><label>Correo</label><input id="clientEmail"><div style="margin-top:14px"><button id="saveClient">Guardar cliente</button></div><div id="clientMsg" class="msg"></div></section><section class="card"><h2>Nuevo contenedor</h2><label>Cliente *</label><select id="shipmentClient"></select><label>Número *</label><input id="containerNumber"><label>Booking</label><input id="bookingNumber"><label>B/L</label><input id="bolNumber"><label>Naviera</label><input id="carrier" placeholder="Crowley"><label>Producto</label><input id="product"><div style="margin-top:14px"><button id="saveShipment" class="orange">Guardar contenedor</button></div><div id="shipmentMsg" class="msg"></div></section></div><section class="card"><h2>Clientes</h2><div id="clients"></div></section></div></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h2 id="modalTitle">Historial</h2><button id="closeModal" class="alt">Cerrar</button></div><div id="modalBody"></div></div></div><script>const $=id=>document.getElementById(id);let token=localStorage.getItem('export_mca_token')||'',clients=[],shipments=[],filter='active';async function api(path,o={}){const r=await fetch(path,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error+(d.details?' · '+d.details:''));return d}const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function note(id,t,ok=false){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'bad')}function show(){ $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadAll()}async function loadAll(){try{const [c,s,d]=await Promise.all([api('/api/clients'),api('/api/shipments'),api('/api/dashboard')]);clients=c.clients||[];shipments=s.shipments||[];renderStats(d);renderClients();renderShipments();$('shipmentClient').innerHTML='<option value="">Seleccionar</option>'+clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}catch(e){alert(e.message)}}function renderStats(d){const labels=[['Clientes',d.stats.clients],['Activos',d.stats.active],['En tránsito',d.stats.in_transit],['En destino',d.stats.at_destination],['Esperando liberación',d.stats.awaiting_release],['Liberados',d.stats.released],['Entregados',d.stats.delivered]];$('stats').innerHTML=labels.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');const a=d.alerts;$('alerts').innerHTML=[['Bienvenidas pendientes',a.welcome_pending],['Sin movimiento +5 días',a.stale_shipments],['Mensajes fallidos',a.failed_messages],['Esperando liberación',a.awaiting_release]].map(x=>`<div class="alert"><b>${x[1]}</b> ${x[0]}</div>`).join('')}function renderClients(){if(!clients.length){$('clients').innerHTML='No hay clientes.';return}$('clients').innerHTML=`<table><thead><tr><th>Nombre</th><th>Empresa</th><th>WhatsApp</th><th>Bienvenida</th><th>Acciones</th></tr></thead><tbody>${clients.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.company||'-')}</td><td>${esc(x.phone)}</td><td><span class="pill ${x.welcome_status==='sent'?'done':''}">${esc(x.welcome_status||'pending')}</span></td><td><div class="actions"><button class="alt" onclick="editClient('${x.id}')">Editar</button><button class="success" onclick="welcome('${x.id}')">Reenviar bienvenida</button><button class="alt" onclick="clientHistory('${x.id}','${esc(x.name)}')">Historial</button><button class="danger" onclick="delClient('${x.id}','${esc(x.name)}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table>`}function searchable(x){return [x.container_number,x.booking_number,x.bol_number,x.carrier,x.product,x.operational_status,x.last_status,x.last_location,x.clients?.name,x.clients?.company,x.clients?.phone].filter(Boolean).join(' ').toLowerCase()}function renderShipments(){const q=$('shipmentSearch').value.toLowerCase().trim();let list=filter==='active'?shipments.filter(x=>x.active!==false):filter==='delivered'?shipments.filter(x=>x.active===false):shipments;if(q)list=list.filter(x=>searchable(x).includes(q));$('shipments').innerHTML=list.length?`<table><thead><tr><th>Contenedor</th><th>Cliente</th><th>Booking/B-L</th><th>Estado</th><th>Ubicación</th><th>Acciones</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.container_number)}</b><br><span class="muted">${esc(x.carrier||'')}</span></td><td>${esc(x.clients?.name||'-')}<br><span class="muted">${esc(x.clients?.phone||'')}</span></td><td>${esc(x.booking_number||'-')}<br>${esc(x.bol_number||'-')}</td><td><span class="pill ${x.active===false?'done':''}">${esc(x.operational_status||x.last_status||'Registrado')}</span></td><td>${esc(x.last_location||'-')}</td><td><div class="actions"><button class="alt" onclick="editShipment('${x.id}')">Editar</button><button class="alt" onclick="historyView('${x.id}','${esc(x.container_number)}')">Historial</button>${x.active===false?`<button class="success" onclick="shipmentAction('${x.id}','reactivate')">Reactivar</button>`:`<button class="orange" onclick="shipmentAction('${x.id}','release')">Notificar liberación</button><button class="success" onclick="shipmentAction('${x.id}','deliver')">Entregado</button>`}</div></td></tr>`).join('')}</tbody></table>`:'No hay resultados.'}async function editClient(id){const x=clients.find(v=>v.id===id),name=prompt('Nombre',x.name);if(name===null)return;const company=prompt('Empresa',x.company||''),phone=prompt('WhatsApp',x.phone),email=prompt('Correo',x.email||'');await api('/api/clients',{method:'PATCH',body:JSON.stringify({id,name,company,phone,email})});loadAll()}async function welcome(id){if(!confirm('¿Reenviar la bienvenida?'))return;try{const r=await api('/api/clients',{method:'PATCH',body:JSON.stringify({id,action:'resend_welcome'})});alert(r.welcome.status==='sent'?'Bienvenida enviada.':'No se pudo enviar: '+(r.welcome.error||r.welcome.status));loadAll()}catch(e){alert(e.message)}}async function delClient(id,name){if(!confirm(`Eliminar ${name} y toda su información?`))return;await api('/api/clients?id='+encodeURIComponent(id),{method:'DELETE'});loadAll()}async function editShipment(id){const x=shipments.find(v=>v.id===id),container_number=prompt('Contenedor',x.container_number);if(container_number===null)return;const booking_number=prompt('Booking',x.booking_number||''),bol_number=prompt('B/L',x.bol_number||''),carrier=prompt('Naviera',x.carrier||''),product=prompt('Producto',x.product||''),operational_status=prompt('Estado',x.operational_status||x.last_status||'Registrado');await api('/api/shipments',{method:'PATCH',body:JSON.stringify({id,container_number,booking_number,bol_number,carrier,product,operational_status})});loadAll()}async function shipmentAction(id,action){const text=action==='release'?'enviar la notificación de liberación':action==='deliver'?'marcar como entregado':'reactivar';if(!confirm('¿Confirmas '+text+'?'))return;try{await api('/api/shipments',{method:'PATCH',body:JSON.stringify({id,action})});loadAll()}catch(e){alert(e.message)}}async function historyView(id,title){const r=await api('/api/history?shipment_id='+id);$('modalTitle').textContent='Historial · '+title;$('modalBody').innerHTML='<div class="timeline">'+[...r.events,...r.notifications.map(n=>({title:'WhatsApp: '+(n.delivery_status||'enviado'),details:n.event_status||'',created_at:n.created_at}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(e=>`<div class="event"><b>${esc(e.title)}</b><div>${esc(e.details||'')}</div><div class="muted">${new Date(e.created_at).toLocaleString()}</div></div>`).join('')+'</div>';$('modal').classList.remove('hidden')}async function clientHistory(id,title){const r=await api('/api/history?client_id='+id);$('modalTitle').textContent='Cliente · '+title;$('modalBody').innerHTML='<div class="timeline">'+r.events.map(e=>`<div class="event"><b>${esc(e.title)}</b><div>${esc(e.details||'')}</div><div class="muted">${new Date(e.created_at).toLocaleString()}</div></div>`).join('')+'</div>';$('modal').classList.remove('hidden')}$('login').onclick=async()=>{try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=r.token;localStorage.setItem('export_mca_token',token);show()}catch(e){note('loginMsg',e.message)}};$('saveClient').onclick=async()=>{try{const r=await api('/api/clients',{method:'POST',body:JSON.stringify({name:$('clientName').value,company:$('clientCompany').value,phone:$('clientPhone').value,email:$('clientEmail').value})});note('clientMsg',r.welcome?.status==='sent'?'Cliente guardado y bienvenida enviada.':'Cliente guardado; bienvenida pendiente.',true);['clientName','clientCompany','clientPhone','clientEmail'].forEach(id=>$(id).value='');loadAll()}catch(e){note('clientMsg',e.message)}};$('saveShipment').onclick=async()=>{try{await api('/api/shipments',{method:'POST',body:JSON.stringify({client_id:$('shipmentClient').value,container_number:$('containerNumber').value,booking_number:$('bookingNumber').value,bol_number:$('bolNumber').value,carrier:$('carrier').value,product:$('product').value})});note('shipmentMsg','Contenedor guardado.',true);['containerNumber','bookingNumber','bolNumber','carrier','product'].forEach(id=>$(id).value='');loadAll()}catch(e){note('shipmentMsg',e.message)}};$('shipmentSearch').oninput=renderShipments;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderShipments()});$('refresh').onclick=loadAll;$('exportCsv').onclick=async()=>{const r=await fetch('/api/export',{headers:{Authorization:`Bearer ${token}`}});if(!r.ok){alert('No se pudo exportar');return}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='export-mca-operaciones.csv';a.click();URL.revokeObjectURL(a.href)};$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('logout').onclick=()=>{localStorage.removeItem('export_mca_token');location.reload()};if(token)show();</script></body></html>
