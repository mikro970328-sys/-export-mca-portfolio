<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export MCA Tracking</title>
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f5f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}header b{color:var(--navy);font-size:20px}main{width:min(1100px,calc(100% - 28px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 10px 25px rgba(6,32,74,.06);margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cfd7e3;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.orange{background:var(--orange)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.msg{margin-top:10px;font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf3ff;color:var(--navy);font-size:12px}.empty{color:var(--muted);padding:20px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<header><b>EXPORT MCA · Tracking</b><button id="logout" class="alt hidden">Salir</button></header>
<main>
<section id="loginCard" class="card" style="max-width:430px;margin:60px auto">
<h2>Acceso privado</h2><p>Entra con la contraseña administrativa.</p>
<label>Contraseña</label><input id="password" type="password" autocomplete="current-password">
<div style="margin-top:14px"><button id="login">Entrar</button></div><div id="loginMsg" class="msg"></div>
</section>
<div id="app" class="hidden">
<div class="grid">
<section class="card"><h2>Nuevo cliente</h2>
<label>Nombre *</label><input id="clientName">
<label>Empresa</label><input id="clientCompany">
<label>WhatsApp *</label><input id="clientPhone" placeholder="+5351234567">
<label>Correo</label><input id="clientEmail" type="email">
<div style="margin-top:14px"><button id="saveClient">Guardar cliente</button></div><div id="clientMsg" class="msg"></div>
</section>
<section class="card"><h2>Nuevo contenedor</h2>
<label>Cliente *</label><select id="shipmentClient"><option value="">Seleccionar</option></select>
<label>Número de contenedor *</label><input id="containerNumber" placeholder="CMCU4960113">
<label>Booking</label><input id="bookingNumber">
<label>B/L</label><input id="bolNumber">
<label>Naviera</label><input id="carrier" placeholder="Crowley">
<label>Producto</label><input id="product">
<div style="margin-top:14px"><button id="saveShipment" class="orange">Guardar contenedor</button></div><div id="shipmentMsg" class="msg"></div>
</section>
</div>
<section class="card"><div class="row" style="justify-content:space-between"><h2>Contenedores registrados</h2><button id="refresh" class="alt">Actualizar</button></div>
<div id="shipments"></div></section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('export_mca_token')||'';
async function api(path,options={}){const res=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||data.details||'Error');return data}
function msg(id,text,ok=false){const el=$(id);el.textContent=text;el.className='msg '+(ok?'ok':'bad')}
function showApp(){ $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadAll() }
async function loadAll(){try{const [c,s]=await Promise.all([api('/api/clients'),api('/api/shipments')]);const sel=$('shipmentClient');sel.innerHTML='<option value="">Seleccionar</option>'+c.clients.map(x=>`<option value="${x.id}">${x.name}${x.company?' · '+x.company:''}</option>`).join('');renderShipments(s.shipments)}catch(e){if(/autorizado/i.test(e.message)){logout()}else alert(e.message)}}
function renderShipments(items){const box=$('shipments');if(!items.length){box.innerHTML='<div class="empty">Aún no hay contenedores registrados.</div>';return}box.innerHTML=`<table><thead><tr><th>Contenedor</th><th>Cliente</th><th>WhatsApp</th><th>Estado</th><th>Ubicación</th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${x.container_number}</b></td><td>${x.clients?.name||'-'}</td><td>${x.clients?.phone||'-'}</td><td><span class="pill">${x.last_status||'Registrado'}</span></td><td>${x.last_location||'-'}</td></tr>`).join('')}</tbody></table>`}
$('login').onclick=async()=>{try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=r.token;localStorage.setItem('export_mca_token',token);showApp()}catch(e){msg('loginMsg',e.message)}};
$('saveClient').onclick=async()=>{try{await api('/api/clients',{method:'POST',body:JSON.stringify({name:$('clientName').value,company:$('clientCompany').value,phone:$('clientPhone').value,email:$('clientEmail').value})});msg('clientMsg','Cliente guardado.',true);['clientName','clientCompany','clientPhone','clientEmail'].forEach(id=>$(id).value='');loadAll()}catch(e){msg('clientMsg',e.message)}};
$('saveShipment').onclick=async()=>{try{await api('/api/shipments',{method:'POST',body:JSON.stringify({client_id:$('shipmentClient').value,container_number:$('containerNumber').value,booking_number:$('bookingNumber').value,bol_number:$('bolNumber').value,carrier:$('carrier').value,product:$('product').value})});msg('shipmentMsg','Contenedor guardado y listo para recibir actualizaciones.',true);['containerNumber','bookingNumber','bolNumber','carrier','product'].forEach(id=>$(id).value='');loadAll()}catch(e){msg('shipmentMsg',e.message)}};
$('refresh').onclick=loadAll;function logout(){token='';localStorage.removeItem('export_mca_token');location.reload()}$('logout').onclick=logout;if(token)showApp();
</script>
</body></html>
