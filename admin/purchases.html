<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · Export MCA</title>
<style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f4f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37;--bad:#b42318;--warn:#9a6700;--soft:#f8fafc;--shadow:0 8px 24px rgba(6,32,74,.06)}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{padding:18px;max-width:1450px;margin:auto}.head,.toolbar,.actions,.dialog-head,.line-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head{align-items:flex-start;margin-bottom:14px}.head h1{margin:0;color:var(--navy);font-size:22px}.muted{font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:8px 11px;font-weight:800;font-size:11px;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}.btn.danger{color:var(--bad);border-color:#efc0bc}.btn:disabled{opacity:.5;cursor:not-allowed}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}.metric b{display:block;color:var(--navy);font-size:20px}.metric span{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:900}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.toolbar{padding:12px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:220px;max-width:500px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs .btn.active{background:var(--navy);color:#fff}.orders{padding:6px 12px 12px}.row{display:grid;grid-template-columns:110px minmax(180px,1.2fr) 120px 135px 150px 130px auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.po{font-weight:900;color:var(--navy)}.small{font-size:10px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;text-transform:uppercase;background:#edf3ff;color:var(--navy)}.pill.ok{background:#eaf6ee;color:var(--ok)}.pill.warn{background:#fff5d8;color:var(--warn)}.pill.bad{background:#fff0ef;color:var(--bad)}.pill.off{background:#f1f2f4;color:#667085}.empty{padding:34px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(6,19,39,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:30}.modal.hidden{display:none}.dialog{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.dialog.compact{width:min(720px,100%)}.dialog h2{margin:0;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:900;margin:9px 0 4px}input,select,textarea{width:100%;border:1px solid #cfd7e3;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text)}textarea{min-height:70px;resize:vertical}.line{border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:9px;background:var(--soft)}.line-title{font-size:12px;font-weight:900;color:var(--navy)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.summary>div{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px}.summary b{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.detail-items{margin-top:12px}.detail-item{border-top:1px solid var(--line);padding:10px 0}.detail-item:first-child{border-top:0}.progress{margin-top:6px;font-size:11px}.msg{font-size:12px;margin-top:10px;color:var(--bad)}.msg.ok{color:var(--ok)}.receive-line{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(2,minmax(100px,.7fr)) minmax(110px,.8fr);gap:8px;align-items:end}.receive-meta{font-size:10px;color:var(--muted);margin-top:4px}.check{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800}.check input{width:auto}.full{grid-column:1/-1}@media(max-width:980px){.row{grid-template-columns:100px 1fr 120px 130px}.row>div:nth-child(5),.row>div:nth-child(6){grid-row:2}.row>.actions{grid-column:4;grid-row:1/3}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:10px}.metrics{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr auto;padding:13px 2px}.row>div{grid-column:1}.row>.actions{grid-column:2;grid-row:1/7;align-self:start;flex-direction:column}.grid,.grid3,.summary{grid-template-columns:1fr}.receive-line{grid-template-columns:1fr 1fr}.receive-line>div:first-child{grid-column:1/-1}.dialog{padding:13px}.head h1{font-size:20px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><div><h1>Compras</h1><div class="muted">Purchase Orders y recepción física vinculada a WR.</div></div><button id="newOrder" class="btn orange">+ Nueva PO</button></div>
  <div id="metrics" class="metrics"></div>
  <section class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Buscar PO, proveedor, referencia o producto"><div class="tabs"><button class="btn active" data-view="open">Abiertas</button><button class="btn" data-view="draft">Borradores</button><button class="btn" data-view="closed">Cerradas</button><button class="btn" data-view="all">Todas</button></div><button id="refresh" class="btn">↻</button></div><div id="orderList" class="orders"></div></section>
</main>

<div id="orderModal" class="modal hidden"><div class="dialog"><div class="dialog-head"><div><h2 id="orderTitle">Nueva Purchase Order</h2><div class="muted">La PO registra lo comprado; el inventario solo nace cuando se registra un WR.</div></div><button class="btn" data-close="order">✕</button></div><div class="grid3"><div><label>Proveedor *</label><select id="oSupplier"></select></div><div><label>Almacén esperado</label><select id="oWarehouse"></select></div><div><label>Moneda *</label><input id="oCurrency" value="USD" maxlength="3"></div></div><div class="grid3"><div><label>Fecha de orden</label><input id="oDate" type="date"></div><div><label>Llegada estimada</label><input id="oExpected" type="datetime-local"></div><div><label>Referencia proveedor</label><input id="oReference"></div></div><label>Notas</label><textarea id="oNotes"></textarea><div class="toolbar" style="padding:12px 0 0;border:0"><div><b>Mercancía ordenada</b><div class="muted">Productos del catálogo maestro.</div></div><button id="addOrderLine" class="btn">+ Línea</button></div><div id="orderLines"></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close="order">Cancelar</button><button id="saveOrder" class="btn orange">Guardar PO</button></div><div id="orderMsg" class="msg"></div></div></div>

<div id="detailModal" class="modal hidden"><div class="dialog"><div class="dialog-head"><div><h2 id="detailTitle"></h2><div id="detailSubtitle" class="muted"></div></div><button class="btn" data-close="detail">✕</button></div><div id="detailBody"></div><div id="detailActions" class="actions" style="justify-content:flex-end;margin-top:14px"></div><div id="detailMsg" class="msg"></div></div></div>

<div id="receiveModal" class="modal hidden"><div class="dialog"><div class="dialog-head"><div><h2 id="receiveTitle">Recibir PO</h2><div class="muted">Esta acción crea un WR real y actualiza el progreso físico de la PO.</div></div><button class="btn" data-close="receive">✕</button></div><div class="grid3"><div><label>Almacén receptor *</label><select id="rWarehouse"></select></div><div><label>Fecha y hora</label><input id="rReceivedAt" type="datetime-local"></div><div><label>Referencia / BOL terrestre</label><input id="rReference"></div></div><div class="grid"><div><label>Camión</label><input id="rTruck"></div><div><label>Chofer</label><input id="rDriver"></div></div><label>Notas</label><textarea id="rNotes"></textarea><div id="receiveLines"></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close="receive">Cancelar</button><button id="saveReceipt" class="btn orange">Registrar WR</button></div><div id="receiveMsg" class="msg"></div></div></div>

<script>
const token=localStorage.getItem('export_mca_token');if(!token)location.href='/admin/';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let orders=[],suppliers=[],warehouses=[],products=[],view='open',editing=null,detailOrder=null,receiving=null,lineSeq=0;
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('export_mca_token');location.href='/admin/';throw new Error('Sesión vencida')}if(!r.ok)throw new Error(d.error||'Error');return d}
const n=v=>Number(v||0),fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(n(v)),money=(v,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format(n(v));
function date(v){return v?new Date(v).toLocaleDateString('es-US'):'—'}function dateTime(v){return v?new Date(v).toLocaleString('es-US'):'—'}
function commercialLabel(s){return ({draft:'Borrador',issued:'Emitida',confirmed:'Confirmada',closed:'Cerrada',cancelled:'Cancelada'})[s]||s}
function receiptLabel(s){return ({pending:'Pendiente',partial:'Parcial',received:'Recibida'})[s]||s||'Pendiente'}
function commercialClass(s){return s==='cancelled'?'bad':s==='closed'?'off':s==='confirmed'?'ok':s==='issued'?'warn':''}function receiptClass(s,excess){return excess?'warn':s==='received'?'ok':s==='partial'?'warn':''}
function orderTotal(o){return (o.items||[]).reduce((sum,i)=>sum+n(i.ordered_quantity)*n(i.unit_cost),0)}
async function load(){const d=await api('/api/purchases');orders=d.orders||[];suppliers=d.suppliers||[];warehouses=d.warehouses||[];products=d.products||[];render();fillMasters()}
function fillMasters(){const s='<option value="">Seleccionar proveedor</option>'+suppliers.map(x=>`<option value="${x.id}">${esc(x.name)}${x.country?' · '+esc(x.country):''}</option>`).join('');$('oSupplier').innerHTML=s;const w='<option value="">Sin almacén definido</option>'+warehouses.map(x=>`<option value="${x.id}">${esc(x.code)} · ${esc(x.name)}</option>`).join('');$('oWarehouse').innerHTML=w;$('rWarehouse').innerHTML='<option value="">Seleccionar almacén</option>'+warehouses.map(x=>`<option value="${x.id}">${esc(x.code)} · ${esc(x.name)}</option>`).join('')}
function filtered(){const q=$('search').value.trim().toLowerCase();return orders.filter(o=>{const statusOk=view==='all'||(view==='draft'?o.status==='draft':view==='closed'?['closed','cancelled'].includes(o.status):['issued','confirmed'].includes(o.status));const hay=[o.po_number,o.supplier?.name,o.supplier_reference,...(o.items||[]).flatMap(i=>[i.product?.sku,i.product?.name,i.product?.brand])].join(' ').toLowerCase();return statusOk&&(!q||hay.includes(q))})}
function render(){const open=orders.filter(o=>['issued','confirmed'].includes(o.status)).length,draft=orders.filter(o=>o.status==='draft').length,received=orders.filter(o=>o.progress?.receipt_status==='received').length,partial=orders.filter(o=>o.progress?.receipt_status==='partial').length;$('metrics').innerHTML=`<div class="metric"><span>Total PO</span><b>${orders.length}</b></div><div class="metric"><span>Borradores</span><b>${draft}</b></div><div class="metric"><span>Abiertas</span><b>${open}</b></div><div class="metric"><span>Parciales</span><b>${partial}</b></div><div class="metric"><span>Recibidas</span><b>${received}</b></div>`;const list=filtered();$('orderList').innerHTML=list.length?list.map(o=>`<article class="row"><div><div class="po">${esc(o.po_number)}</div><div class="small">${date(o.order_date)}</div></div><div><b>${esc(o.supplier?.name||'—')}</b><div class="small">${esc(o.supplier_reference||'Sin referencia')}</div></div><div>${esc(o.warehouse?.code||'—')}<div class="small">${esc(o.warehouse?.name||'Sin almacén')}</div></div><div><span class="pill ${commercialClass(o.status)}">${commercialLabel(o.status)}</span></div><div><span class="pill ${receiptClass(o.progress?.receipt_status,o.progress?.has_excess)}">${o.progress?.has_excess?'Exceso · ':''}${receiptLabel(o.progress?.receipt_status)}</span><div class="small">${o.progress?.received_items||0}/${o.progress?.item_count||0} líneas completas</div></div><div><b>${money(orderTotal(o),o.currency)}</b><div class="small">${(o.items||[]).length} línea(s)</div></div><div class="actions"><button class="btn" data-view-order="${o.id}">Ver</button>${o.status==='draft'?`<button class="btn" data-edit-order="${o.id}">Editar</button>`:''}${['issued','confirmed'].includes(o.status)?`<button class="btn orange" data-receive-order="${o.id}">Recibir</button>`:''}</div></article>`).join(''):'<div class="empty">No hay Purchase Orders en esta vista.</div>';bindRows()}
function bindRows(){document.querySelectorAll('[data-view-order]').forEach(b=>b.onclick=()=>openDetail(b.dataset.viewOrder));document.querySelectorAll('[data-edit-order]').forEach(b=>b.onclick=()=>openOrder(orders.find(o=>o.id===b.dataset.editOrder)));document.querySelectorAll('[data-receive-order]').forEach(b=>b.onclick=()=>openReceive(orders.find(o=>o.id===b.dataset.receiveOrder)))}
function productOptions(selected=''){return '<option value="">Seleccionar producto</option>'+products.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.sku?p.sku+' · ':'')}${esc(p.name)}</option>`).join('')}
function addLine(seed={}){lineSeq++;const id=lineSeq,div=document.createElement('div');div.className='line';div.dataset.line=id;div.innerHTML=`<div class="line-head"><div class="line-title">Línea ${$('orderLines').children.length+1}</div><button class="btn danger" type="button" data-remove-line="${id}">Quitar</button></div><div class="grid3"><div><label>Producto *</label><select class="lProduct">${productOptions(seed.product_id||'')}</select></div><div><label>Cantidad ordenada</label><input class="lQty" type="number" min="0" step="0.001" value="${esc(seed.ordered_quantity||'')}"></div><div><label>Pallets</label><input class="lPallets" type="number" min="0" step="0.001" value="${esc(seed.ordered_pallets||'')}"></div></div><div class="grid3"><div><label>Unidades por pallet</label><input class="lUpp" type="number" min="0" step="0.001" value="${esc(seed.units_per_pallet||'')}"></div><div><label>Costo unitario</label><input class="lCost" type="number" min="0" step="0.0001" value="${esc(seed.unit_cost||'')}"></div><div><label>Notas</label><input class="lNotes" value="${esc(seed.notes||'')}"></div></div><div class="small lProductInfo"></div>`;$('orderLines').appendChild(div);div.querySelector('[data-remove-line]').onclick=()=>{div.remove();if(!$('orderLines').children.length)addLine()};div.querySelector('.lProduct').onchange=()=>syncProduct(div);syncProduct(div)}
function syncProduct(div){const p=products.find(x=>x.id===div.querySelector('.lProduct').value);div.querySelector('.lProductInfo').textContent=p?[p.brand,p.unit,p.package_format].filter(Boolean).join(' · '):'';if(p&&!div.querySelector('.lUpp').value&&p.default_units_per_pallet)div.querySelector('.lUpp').value=p.default_units_per_pallet}
function collectLines(){return [...document.querySelectorAll('#orderLines .line')].map(div=>({product_id:div.querySelector('.lProduct').value,ordered_quantity:div.querySelector('.lQty').value,ordered_pallets:div.querySelector('.lPallets').value,units_per_pallet:div.querySelector('.lUpp').value,unit_cost:div.querySelector('.lCost').value,notes:div.querySelector('.lNotes').value}))}
function localNow(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}
function openOrder(order=null){editing=order||null;$('orderTitle').textContent=order?`Editar ${order.po_number}`:'Nueva Purchase Order';$('oSupplier').value=order?.supplier_id||'';$('oWarehouse').value=order?.warehouse_id||'';$('oCurrency').value=order?.currency||'USD';$('oDate').value=order?.order_date||new Date().toISOString().slice(0,10);$('oExpected').value=order?.expected_at?new Date(new Date(order.expected_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('oReference').value=order?.supplier_reference||'';$('oNotes').value=order?.notes||'';$('orderLines').innerHTML='';(order?.items?.length?order.items:[{}]).forEach(i=>addLine(i));$('orderMsg').textContent='';$('orderModal').classList.remove('hidden')}
function closeModal(name){$(name+'Modal').classList.add('hidden');if(name==='order')editing=null;if(name==='detail')detailOrder=null;if(name==='receive')receiving=null}
async function saveOrder(){const btn=$('saveOrder');try{btn.disabled=true;$('orderMsg').textContent='';const body={action:editing?'replace_plan':'create_plan',purchase_order_id:editing?.id,supplier_id:$('oSupplier').value,warehouse_id:$('oWarehouse').value,order_date:$('oDate').value,expected_at:$('oExpected').value,currency:$('oCurrency').value,supplier_reference:$('oReference').value,notes:$('oNotes').value,lines:collectLines()};await api('/api/purchases',{method:'POST',body:JSON.stringify(body)});closeModal('order');await load()}catch(e){$('orderMsg').textContent=e.message}finally{btn.disabled=false}}
function itemProgress(item){const active=(item.allocations||[]).filter(a=>a.receipt_item?.receipt?.status==='received');const rq=active.reduce((s,a)=>s+n(a.received_quantity),0),rp=active.reduce((s,a)=>s+n(a.received_pallets),0);const complete=(n(item.ordered_quantity)===0||rq>=n(item.ordered_quantity))&&(n(item.ordered_pallets)===0||rp>=n(item.ordered_pallets));return {rq,rp,status:rq===0&&rp===0?'Pendiente':complete?'Recibido':'Parcial'}}
function openDetail(id){detailOrder=orders.find(o=>o.id===id);if(!detailOrder)return;$('detailTitle').textContent=detailOrder.po_number;$('detailSubtitle').textContent=`${detailOrder.supplier?.name||'—'} · ${commercialLabel(detailOrder.status)} · ${receiptLabel(detailOrder.progress?.receipt_status)}`;const o=detailOrder;$('detailBody').innerHTML=`<div class="summary"><div><b>Proveedor</b>${esc(o.supplier?.name||'—')}</div><div><b>Almacén esperado</b>${esc(o.warehouse?.name||'Sin definir')}</div><div><b>Fecha / ETA</b>${date(o.order_date)}<br><span class="small">${dateTime(o.expected_at)}</span></div><div><b>Total estimado</b>${money(orderTotal(o),o.currency)}</div></div><div class="summary"><div><b>Estado comercial</b><span class="pill ${commercialClass(o.status)}">${commercialLabel(o.status)}</span></div><div><b>Estado físico</b><span class="pill ${receiptClass(o.progress?.receipt_status,o.progress?.has_excess)}">${o.progress?.has_excess?'Exceso · ':''}${receiptLabel(o.progress?.receipt_status)}</span></div><div><b>Referencia proveedor</b>${esc(o.supplier_reference||'—')}</div><div><b>Notas</b>${esc(o.notes||'—')}</div></div><div class="detail-items">${(o.items||[]).map(i=>{const p=itemProgress(i);return `<div class="detail-item"><div class="line-head"><div><b>${esc(i.product?.sku?i.product.sku+' · ':'')}${esc(i.product?.name||'Producto')}</b><div class="small">${esc(i.product?.brand||'')} ${esc(i.product?.package_format||'')}</div></div><span class="pill ${p.status==='Recibido'?'ok':p.status==='Parcial'?'warn':''}">${p.status}</span></div><div class="progress">Ordenado: <b>${fmt(i.ordered_quantity)} ${esc(i.unit)}</b>${n(i.ordered_pallets)?` · ${fmt(i.ordered_pallets)} pallets`:''} · Recibido: <b>${fmt(p.rq)} ${esc(i.unit)}</b>${p.rp?` · ${fmt(p.rp)} pallets`:''} · Costo: ${i.unit_cost!=null?money(i.unit_cost,i.currency):'—'}</div>${(i.allocations||[]).length?`<div class="small">WR: ${(i.allocations||[]).map(a=>`${esc(a.receipt_item?.receipt?.receipt_number||'—')} (${a.receipt_item?.receipt?.status==='cancelled'?'anulado':fmt(a.received_quantity)})`).join(' · ')}</div>`:''}</div>`}).join('')}</div>`;const acts=[];if(o.status==='draft')acts.push(`<button class="btn" data-detail-action="edit">Editar</button><button class="btn orange" data-detail-action="issue">Emitir PO</button><button class="btn danger" data-detail-action="cancel">Cancelar PO</button>`);if(o.status==='issued')acts.push(`<button class="btn primary" data-detail-action="confirm">Confirmar</button><button class="btn orange" data-detail-action="receive">Recibir</button><button class="btn" data-detail-action="close">Cerrar</button><button class="btn danger" data-detail-action="cancel">Cancelar</button>`);if(o.status==='confirmed')acts.push(`<button class="btn orange" data-detail-action="receive">Recibir</button><button class="btn" data-detail-action="close">Cerrar</button><button class="btn danger" data-detail-action="cancel">Cancelar</button>`);$('detailActions').innerHTML=acts.join('');$('detailActions').querySelectorAll('[data-detail-action]').forEach(b=>b.onclick=()=>detailAction(b.dataset.detailAction));$('detailMsg').textContent='';$('detailModal').classList.remove('hidden')}
async function detailAction(action){if(!detailOrder)return;if(action==='edit'){closeModal('detail');openOrder(detailOrder);return}if(action==='receive'){closeModal('detail');openReceive(detailOrder);return}const label={issue:'emitir',confirm:'confirmar',cancel:'cancelar',close:'cerrar'}[action];if(!confirm(`¿Confirmas ${label} ${detailOrder.po_number}?`))return;try{await api('/api/purchases',{method:'POST',body:JSON.stringify({action,purchase_order_id:detailOrder.id})});closeModal('detail');await load()}catch(e){$('detailMsg').textContent=e.message}}
function openReceive(order){receiving=order;if(!order)return;$('receiveTitle').textContent=`Recibir ${order.po_number}`;$('rWarehouse').value=order.warehouse_id||'';$('rReceivedAt').value=localNow();$('rReference').value='';$('rTruck').value='';$('rDriver').value='';$('rNotes').value='';$('receiveMsg').textContent='';$('receiveLines').innerHTML=(order.items||[]).map(i=>{const p=itemProgress(i),remQ=Math.max(0,n(i.ordered_quantity)-p.rq),remP=Math.max(0,n(i.ordered_pallets)-p.rp);return `<div class="line receive-line" data-receive-item="${i.id}"><div><div class="line-title">${esc(i.product?.sku?i.product.sku+' · ':'')}${esc(i.product?.name||'Producto')}</div><div class="receive-meta">Ordenado ${fmt(i.ordered_quantity)} ${esc(i.unit)} · Recibido ${fmt(p.rq)} · Pendiente ${fmt(remQ)}${n(i.ordered_pallets)?` · ${fmt(remP)} pallets`:''}</div></div><div><label>Recibir cantidad</label><input class="rrQty" type="number" min="0" step="0.001" value="${remQ||''}"></div><div><label>Pallets</label><input class="rrPallets" type="number" min="0" step="0.001" value="${remP||''}"></div><div><label>Lote</label><input class="rrLot"></div><input class="rrUpp" type="hidden" value="${esc(i.units_per_pallet||'')}"></div>`}).join('');$('receiveModal').classList.remove('hidden')}
function receiptLines(){return [...document.querySelectorAll('[data-receive-item]')].map(div=>({purchase_order_item_id:div.dataset.receiveItem,received_quantity:div.querySelector('.rrQty').value,received_pallets:div.querySelector('.rrPallets').value,units_per_pallet:div.querySelector('.rrUpp').value,lot_number:div.querySelector('.rrLot').value})).filter(x=>n(x.received_quantity)>0||n(x.received_pallets)>0)}
async function submitReceipt(allowOver=false){const btn=$('saveReceipt');try{btn.disabled=true;$('receiveMsg').textContent='';const body={action:'receive',warehouse_id:$('rWarehouse').value,received_at:$('rReceivedAt').value,reference_number:$('rReference').value,truck_reference:$('rTruck').value,driver_name:$('rDriver').value,notes:$('rNotes').value,allow_over_receipt:allowOver,lines:receiptLines()};const d=await api('/api/purchases',{method:'POST',body:JSON.stringify(body)});$('receiveMsg').className='msg ok';$('receiveMsg').textContent=`${d.receipt.receipt_number} registrada correctamente.`;await load();setTimeout(()=>closeModal('receive'),500)}catch(e){if(!allowOver&&String(e.message).includes('requiere confirmación explícita')&&confirm('La cantidad excede lo ordenado. ¿Confirmas registrar el exceso?')){btn.disabled=false;return submitReceipt(true)}$('receiveMsg').className='msg';$('receiveMsg').textContent=e.message}finally{btn.disabled=false}}
$('newOrder').onclick=()=>openOrder();$('addOrderLine').onclick=()=>addLine();$('saveOrder').onclick=saveOrder;$('saveReceipt').onclick=()=>submitReceipt(false);$('refresh').onclick=load;$('search').oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));['order','detail','receive'].forEach(name=>$(name+'Modal').onclick=e=>{if(e.target===$(name+'Modal'))closeModal(name)});load().catch(e=>$('orderList').innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script>
</body></html>
