<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicaciones comerciales | Export MCA</title><link rel="icon" href="/logo.png"><style>
:root{--navy:#06204a;--orange:#f58220;--bg:#f4f7fb;--line:#dfe5ee;--text:#152238;--muted:#667085;--ok:#117a37;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}header img{width:190px;max-height:58px;object-fit:contain}.wrap{width:min(1220px,calc(100% - 28px));margin:22px auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font:inherit}textarea{min-height:90px}button,a.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}button.orange{background:var(--orange)}button.alt,a.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.danger{background:#fff;color:var(--bad);border:1px solid #efb0aa}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}.msg{margin-top:10px;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 7px;font-size:13px;vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf3ff;color:var(--navy);font-size:11px}.published{background:#edf9f0;color:var(--ok)}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}header{align-items:flex-start;gap:12px}}
</style></head><body>
<header><img src="/logo.png" alt="Export MCA LLC"><div class="toolbar"><a class="btn alt" href="/admin/pwa.html">Volver al ERP</a><a class="btn alt" href="https://app.exportmca.com" target="_blank">Ver plataforma pública</a></div></header>
<main class="wrap"><section class="card"><div class="toolbar"><div><h1 style="margin:0;color:var(--navy)">Publicaciones comerciales</h1><div style="color:var(--muted);margin-top:6px">Crea y controla lo que aparece en app.exportmca.com.</div></div><button id="newBtn" class="orange">Nueva publicación</button></div></section>
<section class="grid"><section class="card"><h2 id="formTitle">Nueva publicación</h2><input id="id" type="hidden"><label>Categoría *</label><select id="category"><option value="plaza_merchandise">Mercancía en plaza</option><option value="plaza_containers">Contenedores en plaza</option><option value="upcoming_shipments">Próximos envíos</option><option value="us_warehouse">Almacén de Estados Unidos</option></select><label>Título *</label><input id="title"><label>Descripción</label><textarea id="description"></textarea><div class="grid"><div><label>Precio</label><input id="price" type="number" step="0.01" min="0"></div><div><label>Moneda</label><select id="currency"><option>USD</option><option>EUR</option></select></div></div><div class="grid"><div><label>Cantidad</label><input id="quantity" type="number" step="0.01" min="0"></div><div><label>Unidad</label><input id="unit" placeholder="paneles, contenedor, cajas..."></div></div><label>Ubicación pública</label><input id="location_public" placeholder="En plaza, Almacén USA..."><label>Ubicación interna</label><input id="location_internal" placeholder="Dato privado del ERP"><div class="grid"><div><label>Fecha de salida</label><input id="departure_date" type="date"></div><div><label>Fecha de llegada</label><input id="arrival_date" type="date"></div></div><label>Imágenes</label><textarea id="image_urls" placeholder="Una URL por línea"></textarea><div class="grid"><div><label>Disponibilidad</label><select id="availability_status"><option value="available">Disponible</option><option value="reserved">Reservado</option><option value="sold">Vendido</option><option value="unavailable">No disponible</option></select></div><div><label>Publicación</label><select id="publication_status"><option value="draft">Borrador</option><option value="published">Publicado</option><option value="hidden">Oculto</option><option value="archived">Archivado</option></select></div></div><div class="actions" style="margin-top:16px"><button id="saveBtn" class="orange">Guardar</button><button id="cancelBtn" class="alt" type="button">Limpiar</button></div><div id="msg" class="msg"></div></section>
<section class="card"><div class="toolbar"><h2 style="margin:0">Publicaciones registradas</h2><button id="refreshBtn" class="alt">Actualizar</button></div><div id="list"><div class="empty">Cargando...</div></div></section></section></main>
<script>
const $=id=>document.getElementById(id),token=localStorage.getItem('export_mca_token');if(!token){location.href='/admin/pwa.html'}
let publications=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('export_mca_token');location.href='/admin/pwa.html';throw new Error('Sesión vencida')}if(!r.ok)throw new Error(d.error||'Error');return d}
function reset(){['id','title','description','price','quantity','unit','location_public','location_internal','departure_date','arrival_date','image_urls'].forEach(id=>$(id).value='');$('category').value='plaza_merchandise';$('currency').value='USD';$('availability_status').value='available';$('publication_status').value='draft';$('formTitle').textContent='Nueva publicación';$('msg').textContent=''}
function data(){return{id:$('id').value||undefined,category:$('category').value,title:$('title').value,description:$('description').value,price:$('price').value, currency:$('currency').value,quantity:$('quantity').value,unit:$('unit').value,location_public:$('location_public').value,location_internal:$('location_internal').value,departure_date:$('departure_date').value,arrival_date:$('arrival_date').value,image_urls:$('image_urls').value.split(/\r?\n/).filter(Boolean),availability_status:$('availability_status').value,publication_status:$('publication_status').value}}
async function load(){try{const r=await api('/api/publications');publications=r.publications||[];render()}catch(e){$('list').innerHTML='<div class="empty bad">'+esc(e.message)+'</div>'}}
function render(){if(!publications.length){$('list').innerHTML='<div class="empty">No hay publicaciones todavía.</div>';return}const names={plaza_merchandise:'Mercancía en plaza',plaza_containers:'Contenedores en plaza',upcoming_shipments:'Próximos envíos',us_warehouse:'Almacén USA'};$('list').innerHTML='<table><thead><tr><th>Título</th><th>Categoría</th><th>Estado</th><th>Disponibilidad</th><th>Acciones</th></tr></thead><tbody>'+publications.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span style="color:var(--muted)">${esc(x.location_public||'')}</span></td><td>${esc(names[x.category]||x.category)}</td><td><span class="pill ${x.publication_status==='published'?'published':''}">${esc(x.publication_status)}</span></td><td>${esc(x.availability_status)}</td><td><div class="actions"><button class="alt" onclick="edit('${x.id}')">Editar</button>${x.publication_status!=='published'?`<button onclick="quick('${x.id}','published')">Publicar</button>`:`<button class="alt" onclick="quick('${x.id}','hidden')">Ocultar</button>`}<button class="danger" onclick="removePub('${x.id}')">Eliminar</button></div></td></tr>`).join('')+'</tbody></table>'}
window.edit=id=>{const x=publications.find(v=>v.id===id);if(!x)return;Object.keys(x).forEach(k=>{if($(k)&&!['image_urls'].includes(k))$(k).value=x[k]??''});$('image_urls').value=(x.image_urls||[]).join('\n');$('formTitle').textContent='Editar publicación';scrollTo({top:0,behavior:'smooth'})};window.quick=async(id,status)=>{await api('/api/publications',{method:'PATCH',body:JSON.stringify({id,publication_status:status})});await load()};window.removePub=async id=>{if(!confirm('¿Eliminar esta publicación?'))return;await api('/api/publications?id='+encodeURIComponent(id),{method:'DELETE'});reset();await load()};
$('saveBtn').onclick=async()=>{try{const body=data(),editing=!!body.id;await api('/api/publications',{method:editing?'PATCH':'POST',body:JSON.stringify(body)});$('msg').className='msg ok';$('msg').textContent=editing?'Publicación actualizada.':'Publicación creada.';reset();await load()}catch(e){$('msg').className='msg bad';$('msg').textContent=e.message}};$('newBtn').onclick=reset;$('cancelBtn').onclick=reset;$('refreshBtn').onclick=load;load();
</script></body></html>
