name: UX7 Alert Center Visual Owner

on:
  pull_request:
    paths:
      - 'admin/operational-alert-center.js'
      - 'admin/operational-alert-center.css'
      - 'admin/erp.js'
      - 'api/history.js'
      - 'e2e/browserstack/ux7-production-readonly.spec.cjs'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - 'scripts/check-ux6-alert-center-presentation.mjs'
      - 'scripts/check-ux6-alert-center-style-owner.mjs'
      - 'scripts/check-operational-alert-lifecycle.mjs'
      - 'scripts/check-ux7-alert-center-visual-owner.mjs'
      - 'scripts/check-ux6b-native-workspace-foundation.mjs'
      - 'scripts/check-ux7-navigation-icons.mjs'
      - '.github/workflows/browserstack-ios-certification.yml'
      - '.github/workflows/ux7-alert-center-visual-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-alert-center-visual-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate UX7 Alert Center ownership and runtime fixtures
        run: node scripts/check-ux7-alert-center-visual-owner.mjs
      - name: Validate alert lifecycle and presentation contracts
        run: |
          node scripts/check-ux6-alert-center-presentation.mjs
          node scripts/check-ux6-alert-center-style-owner.mjs
          node scripts/check-operational-alert-lifecycle.mjs
          node scripts/check-user-notifications.mjs
          node scripts/check-ux6-notification-inbox-feedback.mjs
      - name: Validate shell, access and integration boundaries
        run: |
          node scripts/check-access-control.mjs
          node scripts/check-ux6b-native-workspace-foundation.mjs
          node scripts/check-ux7-navigation-icons.mjs
          node scripts/check-frontend-ownership.mjs
          node scripts/check-admin-shell-resilience.mjs
          node scripts/audit-b9-api-boundaries.mjs
          node scripts/check-b9-database-privileges.mjs
          node scripts/check-b9-public-boundaries.mjs
          node scripts/check-integrations.mjs
      - name: Validate real-iPhone read-only contract
        run: node scripts/check-browserstack-ios-readonly.mjs
      - name: Validate JavaScript syntax and API imports
        run: |
          node --check admin/operational-alert-center.js
          node --check admin/erp.js
          node --check api/history.js
          node --check scripts/check-ux7-alert-center-visual-owner.mjs
          node --input-type=module -e "await import('./api/history.js'); console.log('Alert Center API import OK')"
