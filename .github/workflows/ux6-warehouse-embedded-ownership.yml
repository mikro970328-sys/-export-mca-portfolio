name: UX7 Warehouse Visual Owner

on:
  pull_request:
    paths:
      - 'admin/navigation-shell.js'
      - 'admin/warehouse.html'
      - 'admin/warehouse.js'
      - 'admin/warehouse.css'
      - 'admin/warehouse-embedded.js'
      - 'api/warehouse.js'
      - 'scripts/check-ux6-warehouse-embedded-ownership.mjs'
      - 'scripts/check-ux7-warehouse-visual-owner.mjs'
      - '.github/workflows/ux6-warehouse-embedded-ownership.yml'
  workflow_dispatch:

jobs:
  validate-warehouse-embedded-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Warehouse UX-7 owner
        run: |
          node scripts/check-ux7-warehouse-visual-owner.mjs
          node scripts/check-ux6-warehouse-embedded-ownership.mjs
          node scripts/check-ux5-warehouse-receipt-actions.mjs
          node scripts/check-ux6b-embedded-foundation.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/navigation-shell.js
          node --check admin/warehouse.js
          node --check scripts/check-ux6-warehouse-embedded-ownership.mjs
          node --check scripts/check-ux7-warehouse-visual-owner.mjs
          node --input-type=module -e "await import('./api/warehouse.js'); console.log('Warehouse runtime import OK')"
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell resilience
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Validate API security boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privilege hardening
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary hardening
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integration ownership
        run: node scripts/check-integrations.mjs
