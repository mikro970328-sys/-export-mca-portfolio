name: Purchase and Inventory Acceptance

on:
  pull_request:
    paths:
      - 'api/purchases.js'
      - 'api/inventory.js'
      - 'api/_lib.js'
      - 'supabase/migrations/**'
      - 'supabase/tests/ux5_purchase_order_actions.sql'
      - 'supabase/tests/ux5_warehouse_receipt_actions.sql'
      - 'supabase/tests/fixtures/purchase_acceptance_legacy.sql'
      - 'scripts/check-purchase-inventory-*.mjs'
      - 'scripts/lib/purchase-acceptance-*.mjs'
      - 'package*.json'
      - '.github/workflows/purchase-inventory-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'api/purchases.js'
      - 'api/inventory.js'
      - 'api/_lib.js'
      - 'supabase/migrations/**'
      - 'supabase/tests/ux5_purchase_order_actions.sql'
      - 'supabase/tests/ux5_warehouse_receipt_actions.sql'
      - 'supabase/tests/fixtures/purchase_acceptance_legacy.sql'
      - 'scripts/check-purchase-inventory-*.mjs'
      - 'scripts/lib/purchase-acceptance-*.mjs'
      - 'package*.json'
      - '.github/workflows/purchase-inventory-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-business-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real SQL operations in disposable PostgreSQL
        run: node scripts/check-purchase-inventory-acceptance.mjs
      - name: Purchase and inventory handlers with isolated SQL
        run: node scripts/check-purchase-inventory-api.mjs
      - name: Existing purchase and warehouse contracts
        run: |
          node scripts/check-purchase-safe-revision.mjs
          node scripts/check-purchase-total-and-load-units.mjs
          node scripts/check-direct-ship-and-flow-clarity.mjs
          node scripts/check-ux5-canonical-actions.mjs
          node scripts/check-ux5-warehouse-receipt-actions.mjs
