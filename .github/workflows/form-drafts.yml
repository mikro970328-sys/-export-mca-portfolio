name: Form Draft Recovery

on:
  pull_request:
    paths:
      - 'admin/form-drafts.*'
      - 'admin/index.html'
      - 'admin/clients-module.js'
      - 'admin/containers-module.js'
      - 'admin/products.*'
      - 'admin/suppliers.*'
      - 'admin/publications.*'
      - 'admin/purchases.*'
      - 'admin/sales.*'
      - 'admin/sales-order-ux.js'
      - 'admin/invoices.*'
      - 'admin/payables.*'
      - 'scripts/check-form-drafts*.mjs'
      - '.github/workflows/form-drafts.yml'
  push:
    branches: [main]
    paths:
      - 'admin/form-drafts.*'
      - 'admin/index.html'
      - 'admin/clients-module.js'
      - 'admin/containers-module.js'
      - 'admin/products.*'
      - 'admin/suppliers.*'
      - 'admin/publications.*'
      - 'admin/purchases.*'
      - 'admin/sales.*'
      - 'admin/sales-order-ux.js'
      - 'admin/invoices.*'
      - 'admin/payables.*'
      - 'scripts/check-form-drafts*.mjs'
      - '.github/workflows/form-drafts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-form-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated DOM test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Verify form draft integration contract
        run: node scripts/check-form-drafts.mjs
      - name: Verify form draft browser runtime
        run: node scripts/check-form-drafts-runtime.mjs
