name: UX7 Account Visual Owner

on:
  pull_request:
    paths:
      - 'admin/account-administration.js'
      - 'admin/account-administration.css'
      - 'admin/erp.js'
      - 'api/account.js'
      - 'e2e/browserstack/ux7-production-readonly.spec.cjs'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - 'scripts/check-ux6-account-presentation.mjs'
      - 'scripts/check-ux6-shell-ownership.mjs'
      - 'scripts/check-ux6b-native-workspace-foundation.mjs'
      - 'scripts/check-ux7-account-visual-owner.mjs'
      - 'scripts/check-ux7-navigation-icons.mjs'
      - '.github/workflows/browserstack-ios-certification.yml'
      - '.github/workflows/ux7-account-visual-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-account-visual-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate UX7 account ownership and runtime fixture
        run: node scripts/check-ux7-account-visual-owner.mjs
      - name: Validate adjacent account and shell contracts
        run: |
          node scripts/check-ux6-account-presentation.mjs
          node scripts/check-access-control.mjs
          node scripts/check-ux6-shell-ownership.mjs
          node scripts/check-ux6b-native-workspace-foundation.mjs
          node scripts/check-ux7-navigation-icons.mjs
          node scripts/check-frontend-ownership.mjs
          node scripts/check-admin-shell-resilience.mjs
      - name: Validate session and integration boundaries
        run: |
          node scripts/check-session-audit-hardening.mjs
          node scripts/audit-b9-api-boundaries.mjs
          node scripts/check-b9-database-privileges.mjs
          node scripts/check-b9-public-boundaries.mjs
          node scripts/check-integrations.mjs
      - name: Validate real-iPhone read-only contract
        run: node scripts/check-browserstack-ios-readonly.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/account-administration.js
          node --check admin/erp.js
          node --check api/account.js
          node --check scripts/check-ux7-account-visual-owner.mjs
