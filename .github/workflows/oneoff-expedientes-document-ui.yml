name: One-off Expedientes document UI cleanup

on:
  push:
    branches:
      - ux/expedientes-document-actions-cleanup
    paths:
      - '.github/workflows/oneoff-expedientes-document-ui.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/expedientes-document-actions-cleanup
      - name: Apply exact Expedientes UI edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/expedientes-module.js')
          s = p.read_text()

          old_css = ".exp-doc-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.exp-doc-shared"
          new_css = ".exp-doc-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.exp-icon-action{width:34px!important;height:34px!important;min-width:34px!important;padding:0!important;display:inline-grid!important;place-items:center!important;border-radius:9px!important}.exp-icon-action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.exp-doc-shared"
          if old_css not in s:
              raise SystemExit('CSS target not found')
          s = s.replace(old_css, new_css, 1)

          old_row = '''  function documentRow(item) {
    return `<div class="exp-doc-row"><div><b>${esc(item.document_type || 'Documento')}</b>${item.shared_bl ? '<span class="exp-doc-shared">COMPARTIDO</span>' : ''}${item.notes ? `<div class="muted">${esc(item.notes)}</div>` : ''}</div><div>${esc(item.file_name || 'Archivo')}<div class="muted">v${esc(item.version || 1)} · ${esc(formatBytes(item.file_size_bytes))} · ${esc(formatDate(item.created_at))}</div></div><div class="exp-doc-actions">${item.signed_url ? `<button class="alt" type="button" data-open-document="${esc(item.id)}">Abrir</button><button class="alt" type="button" data-download-document="${esc(item.id)}">Descargar</button>` : ''}<button class="danger" type="button" data-delete-document="${esc(item.id)}">Borrar</button></div></div>`;
  }'''
          new_row = '''  function documentRow(item) {
    const downloadIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>';
    const trashIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 15H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>';
    return `<div class="exp-doc-row"><div><b>${esc(item.document_type || 'Documento')}</b>${item.shared_bl ? '<span class="exp-doc-shared">COMPARTIDO</span>' : ''}${item.notes ? `<div class="muted">${esc(item.notes)}</div>` : ''}</div><div>${esc(item.file_name || 'Archivo')}<div class="muted">v${esc(item.version || 1)} · ${esc(formatBytes(item.file_size_bytes))} · ${esc(formatDate(item.created_at))}</div></div><div class="exp-doc-actions">${item.signed_url ? `<button class="alt" type="button" data-open-document="${esc(item.id)}">Ver</button><button class="alt exp-icon-action" type="button" data-download-document="${esc(item.id)}" aria-label="Descargar ${esc(item.file_name || 'documento')}" title="Descargar">${downloadIcon}</button>` : ''}<button class="danger exp-icon-action" type="button" data-delete-document="${esc(item.id)}" aria-label="Borrar ${esc(item.file_name || 'documento')}" title="Borrar">${trashIcon}</button></div></div>`;
  }'''
          if old_row not in s:
              raise SystemExit('documentRow target not found')
          s = s.replace(old_row, new_row, 1)

          old_folder = '''  function folderHtml({ id,title,meta,documents,uploadScope,uploadLabel,children='',sharedContext=null }) {
    const addAction = uploadScope ? `<div class="exp-folder-body-actions"><button class="orange" type="button" data-upload-scope="${esc(uploadScope)}" data-upload-label="${esc(uploadLabel || title)}">+ Agregar documento</button></div>` : '';
    return `<div class="exp-folder ${sharedContext?.shared ? 'shared' : ''}"><div class="exp-folder-head" data-folder-toggle="${esc(id)}" role="button" tabindex="0" aria-expanded="false" aria-controls="${esc(id)}"><div><div class="exp-folder-title"><span id="${esc(id)}-arrow" class="exp-folder-arrow">▶</span><span>${esc(title)}</span>${sharedContext?.shared ? `<span class="exp-shared-badge">Compartido · ${sharedContext.client_count} clientes</span>` : ''}</div><div class="exp-folder-meta">${esc(meta)}</div></div><div class="exp-folder-actions"><span class="pill ${documents.length ? 'done' : ''}">${documents.length} archivo${documents.length === 1 ? '' : 's'}</span></div></div><div id="${esc(id)}" class="exp-folder-body hidden">${addAction}${sharedContextHtml(sharedContext)}${documentBlock(documents,'No hay documentos cargados todavía.')}${children}</div></div>`;
  }'''
          new_folder = '''  function folderHtml({ id,title,meta,documents,uploadScope,uploadLabel,children='',sharedContext=null,totalCount=null }) {
    const addAction = uploadScope ? `<div class="exp-folder-body-actions"><button class="orange" type="button" data-upload-scope="${esc(uploadScope)}" data-upload-label="${esc(uploadLabel || title)}">+ Agregar documento</button></div>` : '';
    const fileCount = Number.isInteger(totalCount) ? totalCount : documents.length;
    return `<div class="exp-folder ${sharedContext?.shared ? 'shared' : ''}"><div class="exp-folder-head" data-folder-toggle="${esc(id)}" role="button" tabindex="0" aria-expanded="false" aria-controls="${esc(id)}"><div><div class="exp-folder-title"><span id="${esc(id)}-arrow" class="exp-folder-arrow">▶</span><span>${esc(title)}</span>${sharedContext?.shared ? `<span class="exp-shared-badge">Compartido · ${sharedContext.client_count} clientes</span>` : ''}</div><div class="exp-folder-meta">${esc(meta)}</div></div><div class="exp-folder-actions"><span class="pill ${fileCount ? 'done' : ''}">${fileCount} archivo${fileCount === 1 ? '' : 's'}</span></div></div><div id="${esc(id)}" class="exp-folder-body hidden">${addAction}${sharedContextHtml(sharedContext)}${documentBlock(documents,'No hay documentos cargados directamente en esta carpeta.')}${children}</div></div>`;
  }'''
          if old_folder not in s:
              raise SystemExit('folderHtml target not found')
          s = s.replace(old_folder, new_folder, 1)

          old_call = "html += folderHtml({ id:`exp-folder-bl-${index}`, title, meta, documents:groupDocs, uploadScope:group.bol ? `bol:${group.bol}` : null, uploadLabel:group.bol ? `B/L ${group.bol}` : null, sharedContext:context, children:`${childTitle}${containerRowsHtml(group.shipments,documents,groupLabel)}` });"
          new_call = "html += folderHtml({ id:`exp-folder-bl-${index}`, title, meta, documents:groupDocs, uploadScope:group.bol ? `bol:${group.bol}` : null, uploadLabel:group.bol ? `B/L ${group.bol}` : null, sharedContext:context, totalCount:groupDocs.length + containerDocCount, children:`${childTitle}${containerRowsHtml(group.shipments,documents,groupLabel)}` });"
          if old_call not in s:
              raise SystemExit('B/L folder call target not found')
          s = s.replace(old_call, new_call, 1)

          p.write_text(s)
          PY
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/expedientes-module.js
          git diff --cached --quiet || git commit -m "UX-D: aclarar conteos y acciones documentales"
          git push origin HEAD:ux/expedientes-document-actions-cleanup
