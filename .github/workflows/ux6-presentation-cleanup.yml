name: UX6 Presentation Cleanup

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'scripts/check-ux6-presentation-cleanup.mjs'
      - '.github/workflows/ux6-presentation-cleanup.yml'
  workflow_dispatch:

jobs:
  validate-presentation-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate duplicate cleanup and user-facing flow
        run: node scripts/check-ux6-presentation-cleanup.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/sales-existing-load-link-v2.js
          node --check scripts/check-ux6-presentation-cleanup.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell resilience
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Validate API security boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privilege hardening
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary hardening
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integration ownership
        run: node scripts/check-integrations.mjs
