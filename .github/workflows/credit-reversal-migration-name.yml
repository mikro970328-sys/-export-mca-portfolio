name: Verify Published Report Selection Recovery
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  public-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1296968075ed1adce7a81b483fd65bd266999c2b
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public assets and anonymous API boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const assets = [
            ['/admin/index.html', 'admin/index.html'],
            ['/admin/reports.html', 'admin/reports.html'],
            ['/admin/reports.js?v=20260916-queue1', 'admin/reports.js']
          ];
          let checks = 0;
          for (const origin of ['https://app.exportmca.com','https://admin.exportmca.com']) {
            for (const [url, path] of assets) {
              const response = await fetch(origin + url, {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
              assert.equal(response.status,200,origin + url);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.ok(bytes.equals(fs.readFileSync(path)),'published bytes differ: ' + origin + url);
              console.log(JSON.stringify({origin,url,status:response.status,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),result:'exact'}));
              checks++;
            }
            const response = await fetch(origin + '/api/reports?dataset=supplier_bills&limit=1',{signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,401,'anonymous reports boundary: ' + origin);
            console.log(JSON.stringify({origin,url:'/api/reports',status:response.status,result:'anonymous rejected'}));
            checks++;
          }
          console.log('PUBLIC_READONLY_CHECKS ' + checks + '/8');
          NODE
