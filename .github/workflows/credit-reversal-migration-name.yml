name: Verify Published Credit Reversal Assets
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b827176978ccb834acbdd97da9d916155cfe4da0
      - name: Anonymous read-only production smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.error,json
          from concurrent.futures import ThreadPoolExecutor
          paths=[('/admin/pwa.html',200,None),('/admin/invoices.html',200,'admin/invoices.html'),('/admin/invoices.js?v=20260916-credit4',200,'admin/invoices.js'),('/api/invoices',401,None),('/api/reports',401,None)]
          def check(item):
              host,path,expected,file=item
              req=urllib.request.Request('https://'+host+path,headers={'User-Agent':'ExportMCA-read-only-release-check'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:status=r.status;body=r.read()
              except urllib.error.HTTPError as e:status=e.code;body=e.read()
              exact=body==Path(file).read_bytes() if file else None
              result={'host':host,'path':path,'status':status,'exact':exact,'ok':status==expected and (exact is None or exact)}
              print('PUBLIC_SMOKE '+json.dumps(result),flush=True)
              return result
          tasks=[(host,*row) for host in ['app.exportmca.com','admin.exportmca.com'] for row in paths]
          with ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(check,tasks))
          assert all(r['ok'] for r in results),results
          print('PUBLIC_SMOKE_PASSED 10/10; no authentication, no business mutations')
          PY
