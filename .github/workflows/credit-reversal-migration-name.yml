name: Review Collection Recovery Evidence
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35142597288
          pattern: browser-*-chromium-desktop
          path: evidence
      - name: Summarize browser evidence and selected screenshots
        run: |
          python - <<'PY'
          import json,pathlib,base64
          root=pathlib.Path('evidence')
          for filename in ['diagnostics.json','commercial-evidence.json']:
            for p in sorted(root.rglob(filename)):
              d=json.loads(p.read_text())
              print('EVIDENCE',str(p),json.dumps({k:d.get(k) for k in ['checkpoints','reconciliation','failure','errors']}))
          for name in ['14-offline-form-recovered.png','11-invoice-paid.png']:
            candidates=list(root.rglob(name))
            if candidates:
              print('IMAGE_BEGIN',name)
              encoded=base64.b64encode(candidates[0].read_bytes()).decode()
              for i in range(0,len(encoded),3000): print(encoded[i:i+3000])
              print('IMAGE_END')
          PY
