name: Name Supplier Payment Recovery Migration
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8609f739c8fd07537ae6434be9249c36b56e4d5c
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes supabase@2.117.0 migration new supplier_payment_retry_integrity
      - run: git status --short supabase/migrations
