name: Verify Published Supplier Recovery
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f4aea87c412ac2dc467c0d934eee2f084307978
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public assets and anonymous boundary without commercial writes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const digest=value=>createHash('sha256').update(value).digest('hex');
          const expected=digest(fs.readFileSync('admin/payables.js','utf8'));
          let count=0;
          for(const host of ['https://app.exportmca.com','https://admin.exportmca.com']){
            for(const path of ['/admin/index.html','/admin/payables.html','/admin/payables.js?v=20260916-supplier-retry1','/api/supplier-payments']){
              const response=await fetch(host+path,{cache:'no-store',signal:AbortSignal.timeout(20000)});
              const body=await response.text();
              assert.equal(response.status,path.startsWith('/api/')?401:200,host+path);
              if(path==='/admin/payables.html')assert.ok(body.includes('/admin/payables.js?v=20260916-supplier-retry1'));
              if(path.startsWith('/admin/payables.js'))assert.equal(digest(body),expected,'published owner differs from verified merge');
              if(path.startsWith('/api/'))assert.ok(JSON.parse(body).error);
              count++;console.log('PASS public GET '+host+path+' '+response.status);
            }
          }
          assert.equal(count,8);console.log('Published supplier recovery: 8/8 read-only checks; exact JS SHA256 '+expected);
          NODE
