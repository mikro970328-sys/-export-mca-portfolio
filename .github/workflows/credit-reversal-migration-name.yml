name: Verify Supplier Finance Precision
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c85087e00c9bb317b3a7e0191298495e3d4ced9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-finance-supplier-variants.mjs
      - run: node scripts/check-finance-api.mjs
      - run: node scripts/check-ux7-payables-visual-owner.mjs
