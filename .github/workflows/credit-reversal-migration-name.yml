name: Inspect Lost Collection Evidence
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35140765936
          name: browser-operators-chromium-desktop
          path: evidence
      - name: Show isolated evidence
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence')
          for p in root.rglob('diagnostics.json'):
            d=json.loads(p.read_text())
            print('DIAGNOSTICS',json.dumps({k:d.get(k) for k in ['failure','clicks','errors','checkpoints']}))
            print('PAYMENT_API',json.dumps([r for r in d.get('api',[]) if r.get('path')=='/api/invoice-payments']))
          for p in root.rglob('error-context.md'):
            print('ERROR_CONTEXT',p.read_text()[:20000])
          PY
