name: Inspect Credit Reversal Acceptance Evidence
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35128013150
          name: browser-direct-ship-chromium-desktop
          path: evidence
      - name: Read isolated desktop result and credit note screenshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json
          for p in Path('evidence').rglob('direct-ship-evidence.json'):
              d=json.loads(p.read_text())
              print('EVIDENCE '+json.dumps({k:v for k,v in d.items() if k!='api'}))
              print('HTTP_COUNTS '+json.dumps({str(s):sum(r['status']==s for r in d['api']) for s in sorted({r['status'] for r in d['api']})}))
          for p in Path('evidence').rglob('23-*.png'):
              data=base64.b64encode(p.read_bytes()).decode()
              print('IMAGE_BEGIN '+p.name)
              for offset in range(0,len(data),12000):print('IMAGE_CHUNK '+data[offset:offset+12000])
              print('IMAGE_END')
          PY
