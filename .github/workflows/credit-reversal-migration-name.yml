name: Inspect isolated browser evidence
on:
  push:
    branches: ['build/credit-reversal-migration']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-cancellation-finance-webkit-mobile
          run-id: 35159275659
          github-token: ${{ github.token }}
          path: evidence
      - name: Read the final operator view
        run: |
          python3 - <<'PY'
          import pathlib,base64
          files=sorted(pathlib.Path('evidence').rglob('final-a*.png'),key=lambda p:len(str(p)))
          if not files: raise SystemExit('Missing final-a image')
          print('SCREENSHOT64:'+base64.b64encode(files[0].read_bytes()).decode())
          PY
