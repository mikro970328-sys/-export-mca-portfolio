name: Verify published receipt recovery
on:
  push:
    branches: ['build/credit-reversal-migration']
permissions:
  contents: read
jobs:
  public-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e53afab6c6efd45966686f597e1b5c20b6aa5cb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Public assets and anonymous API boundary only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const expected=new Map(['admin/warehouse.js','sw.js'].map(file=>[file,hash(fs.readFileSync(file))]));
          for(const origin of ['https://app.exportmca.com','https://admin.exportmca.com']){
            for(const [file,digest] of expected){
              const asset=await fetch(origin+'/'+file+'?v=20260916-receipt-recovery1',{signal:AbortSignal.timeout(20000)});
              assert.equal(asset.status,200);
              assert.equal(hash(Buffer.from(await asset.arrayBuffer())),digest,file);
            }
            const page=await fetch(origin+'/admin/warehouse.html',{signal:AbortSignal.timeout(20000)});
            assert.equal(page.status,200);assert.match(await page.text(),/warehouse\.js\?v=20260916-receipt-recovery1/);
            for(const name of ['warehouse','history','clients','shipments','export']){
              const response=await fetch(origin+'/api/'+name,{signal:AbortSignal.timeout(20000)});
              assert.equal(response.status,401,origin+' /api/'+name);
              await response.arrayBuffer();
            }
            console.log('PASS '+origin+' exact receipt/worker assets and five anonymous API boundaries');
          }
          console.log('PASS public read-only smoke; no credentials, commercial writes or notifications');
          JS
