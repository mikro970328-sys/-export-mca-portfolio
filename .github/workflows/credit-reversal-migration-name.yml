name: Inspect Credit Reversal Browser Screenshot
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35128013150
          name: browser-direct-ship-webkit-mobile
          path: evidence
      - name: Read isolated failure screenshot and trace
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,zipfile
          for p in Path('evidence').rglob('final-state.png'):
              data=base64.b64encode(p.read_bytes()).decode()
              print('IMAGE_BEGIN '+p.name)
              for offset in range(0,len(data),12000):print('IMAGE_CHUNK '+data[offset:offset+12000])
              print('IMAGE_END')
          for p in Path('evidence').rglob('trace.zip'):
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      if not n.endswith('.trace'):continue
                      for l in z.read(n).decode().splitlines():
                          if 'balanceMsg' in l and ('Indica' in l or 'value' in l):print('FORM_TRACE '+l)
          PY
