name: Workday Technical Audit
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
jobs:
  read-only-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7cd441c27e7b1d8d0474df194ac0c8367ec8682
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Current owners and API security boundaries
        run: |
          node scripts/check-frontend-ownership.mjs
          node scripts/audit-b9-api-boundaries.mjs
          node scripts/check-b9-database-privileges.mjs
          node scripts/check-b9-public-boundaries.mjs
      - name: Locate stored technical errors and inventory writers
        run: |
          rg -n 'last_error|error_message|notification_error|provider_error|error_details|inventory_movements' api admin --glob '*.js' --glob '*.html' || test "$?" -eq 1
          rg -n 'register_supplier_payment\(uuid,numeric,date,text,text,text,uuid\)|pay_supplier_bill_canonical\(uuid,numeric,date,text,text,text,uuid\)' scripts || test "$?" -eq 1
      - name: Production dependency advisory snapshot
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const result=spawnSync('npm',['audit','--omit=dev','--json'],{encoding:'utf8',timeout:90000});
          let report;try{report=JSON.parse(result.stdout);}catch{throw Error('Dependency audit did not return JSON');}
          if(report.error)throw Error('Dependency registry audit unavailable: '+report.error.code);
          console.log(JSON.stringify({metadata:report.metadata,vulnerabilities:Object.fromEntries(Object.entries(report.vulnerabilities||{}).map(([name,v])=>[name,{severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range,severity:x.severity})}]))},null,2));
          NODE
