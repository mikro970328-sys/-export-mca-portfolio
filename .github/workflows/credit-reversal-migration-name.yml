name: Inspect isolated browser evidence
on:
  push:
    branches: ['build/credit-reversal-migration']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-cancellation-finance-webkit-mobile
          run-id: 35159275659
          github-token: ${{ github.token }}
          path: evidence
      - name: Read the failed browser boundary
        run: |
          python3 - <<'PY'
          import pathlib,json
          for p in pathlib.Path('evidence').rglob('error-context.md'):
              print(p.read_text())
          for p in pathlib.Path('evidence').rglob('*evidence*.json'):
              v=json.loads(p.read_text())
              print(json.dumps({'checkpoints':v.get('checkpoints'),'errors':v.get('errors'),'api':v.get('api',[])[-35:]},ensure_ascii=False))
          PY
