name: Inspect isolated browser evidence
on:
  push:
    branches: ['build/credit-reversal-migration']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*-webkit-mobile
          run-id: 35159648336
          github-token: ${{ github.token }}
          path: evidence
      - name: Read failing operator evidence
        run: |
          python3 - <<'PY'
          import pathlib,base64,json
          root=pathlib.Path('evidence')
          for story in ['direct-ship','warehouse-recovery','cancellation-finance']:
            dirs=list(root.glob('browser-'+story+'-*'))
            if not dirs: continue
            base=dirs[0]
            names=['final-state*.png','final-a*.png']
            images=[p for n in names for p in base.rglob(n)]
            if images:
              p=min(images,key=lambda p:len(str(p)))
              print('SCREENSHOT_'+story+':'+base64.b64encode(p.read_bytes()).decode())
            records=[p for p in base.rglob('*evidence*.json') if 'attachments' not in str(p)]
            for p in records:
              d=json.loads(p.read_text())
              print('EVIDENCE_'+story+':'+json.dumps(d))
          PY
