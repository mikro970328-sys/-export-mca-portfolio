name: Isolated ERP recovery probe

on:
  push:
    branches: ['build/credit-reversal-migration']

permissions:
  contents: read

jobs:
  public-diagnostics-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c42fc2e6d0d9df56436886ee485eae978ec1f4f2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate acceptance adapter syntax
        run: node --check scripts/check-api-public-error-stored.mjs
      - name: Reproduce stored and indirect public diagnostics
        run: node scripts/check-api-public-error-stored.mjs
      - name: Identify history and notification response owners
        if: always()
        run: git grep -n -E 'shipment_history|Falló WhatsApp|release_failed|notification_inbox_workspace' -- 'api/*.js' 'supabase/migrations/*.sql'
