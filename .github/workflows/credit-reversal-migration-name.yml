name: Inspect Post-release Report Boundary
on:
  push:
    branches: [build/credit-reversal-migration]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35143291710
          name: browser-direct-ship-chromium-desktop
          path: evidence
      - name: Show the first failed boundary without repeating commercial actions
        run: |
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('evidence')
          for p in root.rglob('*.json'):
            if 'attachments' in str(p): continue
            try: d=json.loads(p.read_text())
            except Exception: continue
            if not isinstance(d,dict): continue
            print('SUMMARY',p.name,json.dumps({k:d.get(k) for k in ['checkpoints','failure','errors','crashes','external']}))
            for key in ['api','requests']:
              if isinstance(d.get(key),list):
                print('LAST_REQUESTS',json.dumps(d[key][-35:]))
          for p in root.rglob('error-context.md'):
            print('ERROR_CONTEXT',p.read_text()[:14000])
          PY
