name: Isolated ERP recovery probe
on:
  push:
    branches: ['build/credit-reversal-migration']
permissions:
  contents: read
jobs:
  public-diagnostics-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5411599f559b3dcba249b4d524b2f0185ca1af1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stored and indirect diagnostics
        run: node scripts/check-api-public-error-stored.mjs
      - name: Direct public errors
        run: node scripts/check-api-public-error-responses.mjs
      - name: Preserve notification claims after provider acceptance
        run: node scripts/check-tracking-notification-claim.mjs
