name: Operator and Concurrency Acceptance

on:
  pull_request:
    paths:
      - 'api/**'
      - 'supabase/migrations/**'
      - 'migrations/**'
      - 'supabase/tests/fixtures/*acceptance*.sql'
      - 'scripts/lib/*acceptance*.mjs'
      - 'scripts/lib/operator-browser-server.mjs'
      - 'scripts/check-operator-acceptance.mjs'
      - 'admin/**'
      - 'e2e/browserstack/operator-live-sync.spec.cjs'
      - 'e2e/browserstack/package*.json'
      - 'package*.json'
      - '.github/workflows/operator-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'supabase/migrations/**'
      - 'migrations/**'
      - 'supabase/tests/fixtures/*acceptance*.sql'
      - 'scripts/lib/*acceptance*.mjs'
      - 'scripts/lib/operator-browser-server.mjs'
      - 'scripts/check-operator-acceptance.mjs'
      - 'admin/**'
      - 'e2e/browserstack/operator-live-sync.spec.cjs'
      - 'e2e/browserstack/package*.json'
      - 'package*.json'
      - '.github/workflows/operator-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-operators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-qa-only
          POSTGRES_DB: erp_operator_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:isolated-qa-only@postgres:5432/erp_operator_qa
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: isolated-postgrest-qa-secret-never-production-2026
        ports: ['3000:3000']
    env:
      ERP_TEST_DATABASE_URL: postgres://postgres:isolated-qa-only@127.0.0.1:5432/erp_operator_qa
      ERP_TEST_POSTGREST_URL: http://127.0.0.1:3000
      ERP_TEST_POSTGREST_SECRET: isolated-postgrest-qa-secret-never-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual transactions, operators, login, permissions and revocation
        run: node scripts/check-operator-acceptance.mjs

  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-qa-only
          POSTGRES_DB: erp_operator_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:isolated-qa-only@postgres:5432/erp_operator_qa
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: isolated-postgrest-qa-secret-never-production-2026
        ports: ['3000:3000']
    env:
      ERP_TEST_DATABASE_URL: postgres://postgres:isolated-qa-only@127.0.0.1:5432/erp_operator_qa
      ERP_TEST_POSTGREST_URL: http://127.0.0.1:3000
      ERP_TEST_POSTGREST_SECRET: isolated-postgrest-qa-secret-never-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/browserstack/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e/browserstack
      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium
        working-directory: e2e/browserstack
      - name: Visual two-operator and PWA live-sync acceptance
        run: e2e/browserstack/node_modules/.bin/playwright test e2e/browserstack/operator-live-sync.spec.cjs --reporter=line --output=e2e/browserstack/test-results
      - name: Preserve private QA screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-operator-browser-evidence
          path: e2e/browserstack/test-results/
          retention-days: 7
