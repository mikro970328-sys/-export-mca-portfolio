name: UX5 Sales Canonical Actions

on:
  pull_request:
    paths:
      - 'api/_sales-actions.js'
      - 'api/sales.js'
      - 'api/sales-loads.js'
      - 'admin/sales.js'
      - 'supabase/migrations/20260831133000_ux5_sales_order_action_capabilities.sql'
      - 'supabase/tests/ux5_sales_order_actions.sql'
      - 'scripts/check-ux5-sales-actions.mjs'
      - '.github/workflows/ux5-sales-actions.yml'
  workflow_dispatch:

jobs:
  validate-ux5-sales-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate canonical Sales action ownership
        run: node scripts/check-ux5-sales-actions.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check api/_sales-actions.js
          node --check api/sales.js
          node --check api/sales-loads.js
          node --check admin/sales.js
          node --check scripts/check-ux5-sales-actions.mjs
      - name: Validate Sales API runtime imports
        run: node --input-type=module -e "await Promise.all([import('./api/_sales-actions.js'),import('./api/sales.js'),import('./api/sales-loads.js')]); console.log('Sales API runtime imports OK')"
