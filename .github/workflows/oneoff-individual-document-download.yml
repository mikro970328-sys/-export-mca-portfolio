name: One-off individual document download patch

on:
  push:
    branches:
      - ux/container-document-bundle
    paths:
      - '.github/workflows/oneoff-individual-document-download.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/container-document-bundle
      - name: Apply exact individual-download patch
        run: |
          echo '' | base64 -d > /tmp/patch_individual_download.py
          python3 /tmp/patch_individual_download.py
      - name: Commit exact product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/expedientes-module.js
          git diff --cached --quiet || git commit -m "Expedientes: descargar documentos individuales"
          git push origin HEAD:ux/container-document-bundle
