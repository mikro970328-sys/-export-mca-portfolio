name: UX6 Sales Workspace Presentation

on:
  pull_request:
    paths:
      - 'admin/sales-controller.js'
      - 'admin/sales-workspace.css'
      - 'admin/sales-workspace.js'
      - 'admin/sales.html'
      - 'api/_invoice-actions.js'
      - 'api/sales-workspace.js'
      - 'scripts/check-cuba-documentation.mjs'
      - 'scripts/check-sales-order-profitability.mjs'
      - 'scripts/check-ux6-sales-workspace-presentation.mjs'
      - '.github/workflows/ux6-sales-workspace-presentation.yml'
  workflow_dispatch:

jobs:
  validate-sales-workspace-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Sales workspace UX-6 owner
        run: node scripts/check-ux6-sales-workspace-presentation.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check api/_invoice-actions.js
          node --check api/sales-workspace.js
          node --check admin/sales-controller.js
          node --check admin/sales-workspace.js
          node --check scripts/check-cuba-documentation.mjs
          node --check scripts/check-sales-order-profitability.mjs
          node --check scripts/check-ux6-sales-workspace-presentation.mjs
      - name: Validate API runtime imports
        run: node --input-type=module -e "await Promise.all([import('./api/_invoice-actions.js'),import('./api/sales-workspace.js')]); console.log('Sales workspace API runtime imports OK')"
      - name: Validate canonical Sales actions
        run: node scripts/check-ux5-sales-actions.mjs
      - name: Validate canonical Invoice actions
        run: node scripts/check-ux5-invoice-actions.mjs
      - name: Validate profitability permissions
        run: node scripts/check-sales-order-profitability.mjs
      - name: Validate Cuba document boundary
        run: node scripts/check-cuba-documentation.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Validate integrations
        run: node scripts/check-integrations.mjs
