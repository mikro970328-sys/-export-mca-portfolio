name: Clients Consolidation Check

on:
  pull_request:
    paths:
      - 'admin/clients-module.js'
      - 'admin/erp.js'
      - 'scripts/check-clients-consolidation.mjs'
      - '.github/workflows/clients-consolidation-check.yml'
  workflow_dispatch:

jobs:
  validate-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Clients consolidation
        run: node scripts/check-clients-consolidation.mjs
