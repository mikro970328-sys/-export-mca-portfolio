name: Isolated Load Acceptance
on:
  pull_request:
    paths:
      - 'api/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/fixtures/*acceptance*.sql'
      - 'scripts/lib/*acceptance*.mjs'
      - 'scripts/check-load-acceptance.mjs'
      - 'scripts/check-shipment-list-pages.mjs'
      - 'package*.json'
      - '.github/workflows/load-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'supabase/migrations/**'
      - 'scripts/check-load-acceptance.mjs'
      - 'scripts/check-shipment-list-pages.mjs'
      - '.github/workflows/load-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-qa-only
          POSTGRES_DB: erp_operator_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:isolated-qa-only@postgres:5432/erp_operator_qa
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_MAX_ROWS: '1000'
          PGRST_JWT_SECRET: isolated-postgrest-qa-secret-never-production-2026
        ports: ['3000:3000']
    env:
      ERP_LOAD_ACCEPTANCE: synthetic-only
      ERP_TEST_DATABASE_URL: postgres://postgres:isolated-qa-only@127.0.0.1:5432/erp_operator_qa
      ERP_TEST_POSTGREST_URL: http://127.0.0.1:3000
      ERP_TEST_POSTGREST_SECRET: isolated-postgrest-qa-secret-never-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify complete pages and reject incomplete list responses
        run: node scripts/check-shipment-list-pages.mjs
      - name: Actual API handlers, 2000 shipments, 100 invoices and 5/20/50 sessions
        run: node scripts/check-load-acceptance.mjs
      - name: Preserve anonymous aggregate timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-load-metrics
          path: load-acceptance-metrics.json
          retention-days: 30
