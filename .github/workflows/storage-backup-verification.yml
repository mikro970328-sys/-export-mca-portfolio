name: Storage Backup Verification
on:
  pull_request:
    paths:
      - 'scripts/storage-backup.mjs'
      - 'scripts/check-storage-backup.mjs'
      - 'workers/storage-backup/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storage-backup-verification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/storage-backup.mjs'
      - 'scripts/check-storage-backup.mjs'
      - 'workers/storage-backup/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storage-backup-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-storage-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify read-only export and offline integrity with a local HTTP fixture
        run: node --test scripts/check-storage-backup.mjs
      - name: Verify the scheduled R2 backup worker
        run: npm run test:storage-backup-worker
      - name: Validate the Wrangler bundle without deploying
        run: npm run cf:backup:check
      # No credentials, schedules or uploaded artifacts. The real export is run privately.
