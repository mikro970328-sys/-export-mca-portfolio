name: UX6 Workers Presentation

on:
  pull_request:
    paths:
      - 'admin/workers-module.css'
      - 'admin/workers-module.js'
      - 'admin/index.html'
      - 'admin/erp.js'
      - 'api/admins.js'
      - 'scripts/check-ux6-workers-presentation.mjs'
      - '.github/workflows/integrate-workers.yml'
      - '.github/workflows/ux6-workers-presentation.yml'
  workflow_dispatch:

jobs:
  validate-workers-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Workers UX-6 owner
        run: node scripts/check-ux6-workers-presentation.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/workers-module.js
          node --check admin/erp.js
          node --check api/admins.js
          node --check scripts/check-ux6-workers-presentation.mjs
      - name: Validate API runtime import
        run: node --input-type=module -e "await import('./api/admins.js'); console.log('Workers API runtime import OK')"
      - name: Validate access control
        run: node scripts/check-access-control.mjs
      - name: Validate session and audit ownership
        run: node scripts/check-session-audit-hardening.mjs
      - name: Validate UX-6 presentation cleanup
        run: node scripts/check-ux6-presentation-cleanup.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Audit API boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privileges
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integrations
        run: node scripts/check-integrations.mjs
