name: PostgreSQL Migration Test

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/postgres-migration-test.yml'
  workflow_dispatch:

jobs:
  migration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: export_mca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d export_mca_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: export_mca_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create current CRM fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/architecture_v1_fixture.sql

      - name: Run migration first time
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728_architecture_v1_core.sql

      - name: Run migration second time
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728_architecture_v1_core.sql

      - name: Verify schema and compatibility
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verify_architecture_v1.sql
