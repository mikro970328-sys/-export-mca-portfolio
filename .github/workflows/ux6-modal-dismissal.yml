name: UX6 Modal Dismissal

on:
  pull_request:
    paths:
      - 'admin/modal-dismissal.js'
      - 'admin/native-workspace-foundation.css'
      - 'admin/index.html'
      - 'admin/erp.js'
      - 'scripts/check-ux6-modal-dismissal.mjs'
      - 'scripts/check-ux6b-native-workspace-foundation.mjs'
      - 'scripts/check-frontend-ownership.mjs'
      - '.github/workflows/ux6-modal-dismissal.yml'
  workflow_dispatch:

jobs:
  validate-modal-dismissal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate controlled modal dismissal
        run: node scripts/check-ux6-modal-dismissal.mjs
      - name: Validate native workspace foundation
        run: node scripts/check-ux6b-native-workspace-foundation.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
