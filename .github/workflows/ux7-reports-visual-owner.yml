name: UX7 Reports Visual Owner

on:
  pull_request:
    paths:
      - 'admin/reports.html'
      - 'admin/reports.css'
      - 'admin/reports.js'
      - 'admin/embedded-auto-refresh.js'
      - 'admin/navigation-shell.js'
      - 'api/reports.js'
      - 'e2e/browserstack/**'
      - 'scripts/check-executive-reports.mjs'
      - 'scripts/check-ux6b-finance-admin-foundation.mjs'
      - 'scripts/check-ux7-reports-visual-owner.mjs'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - '.github/workflows/ux7-reports-visual-owner.yml'
      - '.github/workflows/browserstack-ios-certification.yml'
  workflow_dispatch:

jobs:
  validate-reports-visual-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Reportes UX-7 owner
        run: |
          node scripts/check-ux7-reports-visual-owner.mjs
          node scripts/check-executive-reports.mjs
          node scripts/check-ux6b-finance-admin-foundation.mjs
          node scripts/check-browserstack-ios-readonly.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/reports.js
          node --check api/reports.js
          node --check scripts/check-ux7-reports-visual-owner.mjs
          node --check scripts/check-executive-reports.mjs
      - name: Validate API runtime import
        run: node --input-type=module -e "await import('./api/reports.js'); console.log('Reports runtime import OK')"
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Audit API boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privileges
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integrations
        run: node scripts/check-integrations.mjs
