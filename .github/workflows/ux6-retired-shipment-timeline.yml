name: UX6 Retired Shipment Timeline

on:
  pull_request:
    paths:
      - 'admin/shipment-timeline.js'
      - 'admin/containers-module.js'
      - 'scripts/check-integrations.mjs'
      - 'scripts/check-ux6-retired-shipment-timeline.mjs'
      - '.github/workflows/ux6-retired-shipment-timeline.yml'
  workflow_dispatch:

jobs:
  validate-retired-shipment-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-ux6-retired-shipment-timeline.mjs
      - run: node scripts/check-integrations.mjs
      - run: node scripts/check-frontend-ownership.mjs
      - run: node scripts/check-ux5-shipment-actions.mjs
      - name: Validate gate syntax
        run: node --check scripts/check-ux6-retired-shipment-timeline.mjs
