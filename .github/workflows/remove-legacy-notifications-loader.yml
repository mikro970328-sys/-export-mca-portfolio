name: Remove legacy notifications loader
on:
  workflow_dispatch:
  push:
    branches:
      - fix/global-initial-render
    paths:
      - .github/workflows/remove-legacy-notifications-loader.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-initial-render
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove only legacy notifications script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin/index.html')
          text = path.read_text()
          target = '<script src="/admin/notifications.js"></script>'
          count = text.count(target)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy notifications tag, found {count}')
          path.write_text(text.replace(target, '', 1))
          PY
      - name: Verify current alert center remains loaded
        run: |
          grep -q "operational-alert-center.js" admin/erp.js
          ! grep -q '<script src="/admin/notifications.js"></script>' admin/index.html
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          git commit -m "Stop loading legacy notifications renderer"
          git rm .github/workflows/remove-legacy-notifications-loader.yml
          git commit -m "Remove one-time notifications cleanup workflow"
          git push origin HEAD:fix/global-initial-render
