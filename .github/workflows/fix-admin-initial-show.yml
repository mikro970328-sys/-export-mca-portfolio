name: Centralize admin module loading

on:
  push:
    branches:
      - fix/global-initial-render
    paths:
      - .github/workflows/fix-admin-initial-show.yml

permissions:
  contents: write

jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-initial-render

      - name: Move remaining scripts under the central loader
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('admin/index.html')
          index = index_path.read_text()
          old_tail = '<script src="/admin/erp.js"></script><script src="/admin/workers-module.js"></script><script src="/admin/notifications.js"></script></body></html>'
          new_tail = '<script src="/admin/erp.js"></script></body></html>'
          if old_tail not in index:
              raise SystemExit('Expected direct module script tail was not found')
          index_path.write_text(index.replace(old_tail, new_tail, 1))

          loader_path = Path('admin/erp.js')
          loader = loader_path.read_text()
          old = """      const independentModules = [
        loadScript('/admin/mobile-interaction-core.js?v=20260730-5', 'data-mobile-interaction-core'),
        loadScript('/admin/dashboard-operational-state.js?v=20260730-2', 'data-dashboard-operational-state')
      ];"""
          new = """      const independentModules = [
        loadScript('/admin/mobile-interaction-core.js?v=20260730-5', 'data-mobile-interaction-core'),
        loadScript('/admin/dashboard-operational-state.js?v=20260730-2', 'data-dashboard-operational-state'),
        loadScript('/admin/notifications.js?v=20260731-1', 'data-notifications-module')
      ];"""
          if old not in loader:
              raise SystemExit('Expected independentModules block was not found')
          loader_path.write_text(loader.replace(old, new, 1))
          PY

      - name: Verify one loader owns module startup
        run: |
          grep -F '<script src="/admin/erp.js"></script></body></html>' admin/index.html
          grep -F '<script src="/admin/workers-module.js"></script>' admin/index.html && exit 1 || true
          grep -F '<script src="/admin/notifications.js"></script>' admin/index.html && exit 1 || true
          grep -F "loadScript('/admin/notifications.js?v=20260731-1', 'data-notifications-module')" admin/erp.js
          node --check admin/erp.js

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-admin-initial-show.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html admin/erp.js .github/workflows/fix-admin-initial-show.yml
          git commit -m "Centralize admin module startup"
          git push origin HEAD:fix/global-initial-render
