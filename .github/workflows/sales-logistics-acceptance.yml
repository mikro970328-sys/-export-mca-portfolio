name: Sales and Logistics Acceptance

on:
  pull_request:
    paths:
      - 'api/sales*.js'
      - 'api/loads.js'
      - 'api/_sales-actions.js'
      - 'api/_load*.js'
      - 'api/_lib.js'
      - 'api/direct-shipment-dispatch.js'
      - 'api/shipment-document*.js'
      - 'supabase/migrations/**'
      - 'migrations/**'
      - 'supabase/tests/fixtures/*acceptance*.sql'
      - 'supabase/tests/ux5_load_actions.sql'
      - 'scripts/check-sales-logistics-*.mjs'
      - 'scripts/lib/sales-logistics-acceptance-*.mjs'
      - 'scripts/lib/purchase-acceptance-db.mjs'
      - 'package*.json'
      - '.github/workflows/sales-logistics-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'api/sales*.js'
      - 'api/loads.js'
      - 'api/_sales-actions.js'
      - 'api/_load*.js'
      - 'api/_lib.js'
      - 'api/direct-shipment-dispatch.js'
      - 'api/shipment-document*.js'
      - 'supabase/migrations/**'
      - 'migrations/**'
      - 'supabase/tests/fixtures/*acceptance*.sql'
      - 'supabase/tests/ux5_load_actions.sql'
      - 'scripts/check-sales-logistics-*.mjs'
      - 'scripts/lib/sales-logistics-acceptance-*.mjs'
      - 'scripts/lib/purchase-acceptance-db.mjs'
      - 'package*.json'
      - '.github/workflows/sales-logistics-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-business-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real sales, load, dispatch and document SQL
        run: node scripts/check-sales-logistics-acceptance.mjs
      - name: Real handlers and action helpers with isolated SQL
        run: node scripts/check-sales-logistics-api.mjs
      - name: Existing module contracts
        run: |
          node scripts/check-ux5-load-actions.mjs
          node scripts/check-ux5-sales-actions.mjs
          node scripts/check-ux6-sales-explicit-owner.mjs
          node scripts/check-purchase-total-and-load-units.mjs
          node scripts/check-direct-ship-and-flow-clarity.mjs
          node scripts/check-cuba-documentation.mjs
          node scripts/check-sales-supply-workspace.mjs
          node scripts/check-sales-customer-finance.mjs
          node scripts/check-ux6-loads-presentation.mjs
