name: Container Tracking Notifications

on:
  pull_request:
    paths:
      - 'supabase/migrations/*container_tracking_assignment_notifications.sql'
      - 'scripts/check-container-tracking-notifications.mjs'
      - 'scripts/check-tracking-notification-claim.mjs'
      - 'scripts/check-tracking-workflow-lifecycle.mjs'
      - 'scripts/check-workflow-manual-assignment.mjs'
      - 'scripts/lib/*acceptance*.mjs'
      - 'supabase/tests/fixtures/**'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'api/manual-tracking-event.js'
      - 'api/shipments.js'
      - 'api/_notification-delivery.js'
      - '.github/workflows/container-tracking-notifications.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*container_tracking_assignment_notifications.sql'
      - 'scripts/check-container-tracking-notifications.mjs'
      - 'scripts/check-tracking-notification-claim.mjs'
      - 'scripts/check-tracking-workflow-lifecycle.mjs'
      - 'scripts/check-workflow-manual-assignment.mjs'
      - 'scripts/lib/*acceptance*.mjs'
      - 'supabase/tests/fixtures/**'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'api/manual-tracking-event.js'
      - 'api/shipments.js'
      - 'api/_notification-delivery.js'
      - '.github/workflows/container-tracking-notifications.yml'

permissions:
  contents: read

jobs:
  validate-container-tracking-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate notification contract
        run: node scripts/check-container-tracking-notifications.mjs
      - name: Preserve accepted WhatsApp claims on persistence failures
        run: node scripts/check-tracking-notification-claim.mjs
      - name: Check public error responses
        run: node scripts/check-api-public-error-responses.mjs
      - name: Integrate tracking, documents, tasks and personal notifications
        run: node scripts/check-tracking-workflow-lifecycle.mjs

      - name: Manual workflow assignment persistence and migration
        run: node scripts/check-workflow-manual-assignment.mjs
