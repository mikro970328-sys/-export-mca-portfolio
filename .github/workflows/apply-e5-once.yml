name: Apply UX-E5 Once

on:
  push:
    branches:
      - ux/e5-importadora-por-contenedor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/e5-importadora-por-contenedor
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply E5 transformations
        run: node scripts/apply-e5-importer.mjs
      - name: Commit clean product diff
        run: |
          rm scripts/apply-e5-importer.mjs
          rm .github/workflows/apply-e5-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/containers-module.js admin/expedientes-module.js scripts/apply-e5-importer.mjs .github/workflows/apply-e5-once.yml
          git commit -m 'UX-E5: importadora libre por contenedor y visible en expedientes'
          git push origin HEAD:ux/e5-importadora-por-contenedor
