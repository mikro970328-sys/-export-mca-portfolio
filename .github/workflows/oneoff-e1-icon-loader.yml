name: One-off UX-E1 icon loader

on:
  push:
    branches:
      - ux/e1-icon-system
    paths:
      - '.github/workflows/oneoff-e1-icon-loader.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/e1-icon-system
      - name: Register icon system in admin boot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/erp.js')
          s = p.read_text()
          if "data-ui-icon-system" in s:
              raise SystemExit(0)
          anchor1 = "  const navigationStylesPromise = loadStylesheet('/admin/navigation-shell.css?v=20260817-uxa2', 'data-navigation-shell-style');"
          replacement1 = anchor1 + "\n  const iconSystemPromise = loadScript('/admin/ui-icon-system.js?v=20260817-e1', 'data-ui-icon-system');"
          if anchor1 not in s:
              raise SystemExit('icon loader anchor not found')
          s = s.replace(anchor1, replacement1, 1)
          anchor2 = "      await themePromise;\n      await navigationStylesPromise;"
          replacement2 = "      await themePromise;\n      await iconSystemPromise;\n      await navigationStylesPromise;"
          if anchor2 not in s:
              raise SystemExit('boot order anchor not found')
          s = s.replace(anchor2, replacement2, 1)
          p.write_text(s)
          PY
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/erp.js
          git diff --cached --quiet || git commit -m "UX-E1: load SVG icon system during admin boot"
          git push origin HEAD:ux/e1-icon-system
