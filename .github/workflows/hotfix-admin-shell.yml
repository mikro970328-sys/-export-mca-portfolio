name: Admin Shell Hotfix

on:
  pull_request:
    paths:
      - 'admin/erp.js'
      - 'admin/index.html'
      - 'admin/admin-shell-runtime.js'
      - 'admin/admin-data-loader.js'
      - 'admin/dashboard-operational-state.js'
      - 'admin/notification-inbox.js'
      - 'scripts/check-admin-shell-resilience.mjs'
      - 'scripts/check-ux6-shell-ownership.mjs'
      - 'scripts/check-access-control.mjs'
      - 'scripts/check-executive-dashboard.mjs'
      - '.github/workflows/hotfix-admin-shell.yml'
  workflow_dispatch:

jobs:
  admin-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check hotfix JavaScript
        run: |
          node --check admin/erp.js
          node --check admin/admin-shell-runtime.js
          node --check admin/admin-data-loader.js
          node --check admin/dashboard-operational-state.js
          node --check admin/notification-inbox.js
          node --check scripts/check-admin-shell-resilience.mjs
          node --check scripts/check-ux6-shell-ownership.mjs
          node --check scripts/check-access-control.mjs
          node --check scripts/check-executive-dashboard.mjs
      - name: Verify resilient shell and notification owner
        run: |
          node scripts/check-admin-shell-resilience.mjs
          node scripts/check-ux6-shell-ownership.mjs
      - name: Preserve operational alert lifecycle
        run: node scripts/check-operational-alert-lifecycle.mjs
      - name: Preserve access control boundary
        run: node scripts/check-access-control.mjs
      - name: Preserve resilient executive dashboard
        run: node scripts/check-executive-dashboard.mjs
