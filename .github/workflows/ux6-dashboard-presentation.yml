name: UX6 Dashboard Presentation

on:
  pull_request:
    paths:
      - 'admin/dashboard-operational-state.js'
      - 'admin/dashboard-alert-cleanup.js'
      - 'admin/erp.js'
      - 'scripts/check-executive-dashboard.mjs'
      - 'scripts/check-b8-release-validation.mjs'
      - 'scripts/check-admin-shell-resilience.mjs'
      - 'scripts/check-ux6-dashboard-presentation.mjs'
      - '.github/workflows/ux6-dashboard-presentation.yml'
  workflow_dispatch:

jobs:
  validate-dashboard-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate dashboard operational presentation
        run: node scripts/check-ux6-dashboard-presentation.mjs
      - name: Validate P11 executive dashboard contract
        run: node scripts/check-executive-dashboard.mjs
      - name: Validate P13 release contract
        run: node scripts/check-b8-release-validation.mjs
      - name: Validate admin shell resilience
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/dashboard-operational-state.js
          node --check scripts/check-executive-dashboard.mjs
          node --check scripts/check-b8-release-validation.mjs
          node --check scripts/check-admin-shell-resilience.mjs
          node --check scripts/check-ux6-dashboard-presentation.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
