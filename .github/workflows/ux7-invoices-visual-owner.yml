name: UX7 Invoices Visual Owner

on:
  pull_request:
    paths:
      - 'admin/invoices.html'
      - 'admin/invoices.css'
      - 'admin/invoices.js'
      - 'admin/embedded-auto-refresh.js'
      - 'admin/operational-navigation.js'
      - 'admin/operational-context-bridge.js'
      - 'api/invoices.js'
      - 'api/invoice-payments.js'
      - 'scripts/check-ux7-invoices-visual-owner.mjs'
      - 'scripts/check-ux6-invoices-presentation.mjs'
      - 'scripts/check-ux5-invoice-actions.mjs'
      - 'scripts/check-contextual-sync.mjs'
      - '.github/workflows/ux7-invoices-visual-owner.yml'
  workflow_dispatch:

jobs:
  validate-invoices-visual-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Facturación UX-7 owner
        run: |
          node scripts/check-ux7-invoices-visual-owner.mjs
          node scripts/check-ux6-invoices-presentation.mjs
          node scripts/check-ux5-invoice-actions.mjs
      - name: Validate Customer Finance ownership
        run: |
          node scripts/check-sales-customer-finance.mjs
          node scripts/check-ux5-customer-finance-actions.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/invoices.js
          node --check admin/operational-navigation.js
          node --check admin/operational-context-bridge.js
          node --check api/invoices.js
          node --check api/invoice-payments.js
          node --check scripts/check-ux7-invoices-visual-owner.mjs
          node --check scripts/check-ux6-invoices-presentation.mjs
          node --check scripts/check-ux5-invoice-actions.mjs
          node --check scripts/check-contextual-sync.mjs
      - name: Validate API runtime imports
        run: node --input-type=module -e "await Promise.all([import('./api/_invoice-actions.js'),import('./api/invoices.js'),import('./api/invoice-payments.js')]); console.log('Invoice API runtime imports OK')"
      - name: Validate frontend ownership
        run: |
          node scripts/check-contextual-sync.mjs
          node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Audit API boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privileges
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integrations
        run: node scripts/check-integrations.mjs
