name: UX6 Alert Center Style Owner

on:
  pull_request:
    paths:
      - 'admin/operational-alert-center.js'
      - 'admin/operational-alert-center.css'
      - 'admin/erp.js'
      - 'admin/index.html'
      - 'scripts/check-ux6-alert-center-style-owner.mjs'
      - '.github/workflows/ux6-alert-center-style-owner.yml'
  workflow_dispatch:

jobs:
  validate-alert-center-style-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate alert center style ownership
        run: node scripts/check-ux6-alert-center-style-owner.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/operational-alert-center.js
          node --check admin/erp.js
          node --check scripts/check-ux6-alert-center-style-owner.mjs
      - name: Validate UX6 alert center presentation
        run: node scripts/check-ux6-alert-center-presentation.mjs
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Preserve operational alert lifecycle
        run: node scripts/check-operational-alert-lifecycle.mjs
      - name: Preserve user notification ownership
        run: node scripts/check-user-notifications.mjs
      - name: Preserve integration ownership
        run: node scripts/check-integrations.mjs
