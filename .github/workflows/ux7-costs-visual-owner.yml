name: UX7 Costs Visual Owner

on:
  pull_request:
    paths:
      - 'admin/costs.html'
      - 'admin/costs.css'
      - 'admin/costs.js'
      - 'admin/embedded-auto-refresh.js'
      - 'admin/navigation-shell.js'
      - 'api/_cost-actions.js'
      - 'api/costs.js'
      - 'api/profitability.js'
      - 'e2e/browserstack/**'
      - 'scripts/check-ux7-costs-visual-owner.mjs'
      - 'scripts/check-ux6-costs-presentation.mjs'
      - 'scripts/check-sales-order-profitability.mjs'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - '.github/workflows/ux7-costs-visual-owner.yml'
      - '.github/workflows/browserstack-ios-certification.yml'
  workflow_dispatch:

jobs:
  validate-costs-visual-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Costos UX-7 owner
        run: |
          node scripts/check-ux7-costs-visual-owner.mjs
          node scripts/check-ux6-costs-presentation.mjs
          node scripts/check-sales-order-profitability.mjs
          node scripts/check-ux6b-finance-admin-foundation.mjs
          node scripts/check-browserstack-ios-readonly.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/costs.js
          node --check api/_cost-actions.js
          node --check api/costs.js
          node --check api/profitability.js
          node --check scripts/check-ux7-costs-visual-owner.mjs
          node --check scripts/check-ux6-costs-presentation.mjs
          node --check scripts/check-sales-order-profitability.mjs
      - name: Validate API runtime imports
        run: node --input-type=module -e "await Promise.all([import('./api/_cost-actions.js'),import('./api/costs.js'),import('./api/profitability.js')]); console.log('Costs runtime imports OK')"
      - name: Validate frontend ownership
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate admin shell
        run: node scripts/check-admin-shell-resilience.mjs
      - name: Audit API boundaries
        run: node scripts/audit-b9-api-boundaries.mjs
      - name: Validate database privileges
        run: node scripts/check-b9-database-privileges.mjs
      - name: Validate public boundary
        run: node scripts/check-b9-public-boundaries.mjs
      - name: Validate integrations
        run: node scripts/check-integrations.mjs
