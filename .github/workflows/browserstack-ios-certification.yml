name: BrowserStack iOS UX-7 Certification

on:
  push:
    branches:
      - main
    paths:
      - 'e2e/browserstack/**'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - 'admin/payables.html'
      - 'admin/payables.css'
      - 'admin/payables.js'
      - 'admin/ap-traceability.js'
      - 'admin/ap-context-bridge.js'
      - 'admin/costs.html'
      - 'admin/costs.css'
      - 'admin/costs.js'
      - 'api/costs.js'
      - 'api/profitability.js'
      - '.github/workflows/browserstack-ios-certification.yml'
  pull_request:
    paths:
      - 'e2e/browserstack/**'
      - 'scripts/check-browserstack-ios-readonly.mjs'
      - 'admin/payables.html'
      - 'admin/payables.css'
      - 'admin/payables.js'
      - 'admin/ap-traceability.js'
      - 'admin/ap-context-bridge.js'
      - 'admin/costs.html'
      - 'admin/costs.css'
      - 'admin/costs.js'
      - 'api/costs.js'
      - 'api/profitability.js'
      - '.github/workflows/browserstack-ios-certification.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: Public ERP URL to certify
        required: true
        default: https://admin.exportmca.com
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: browserstack-ios-ux7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/browserstack/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e/browserstack
      - name: Verify the no-write test contract
        run: node scripts/check-browserstack-ios-readonly.mjs
      - name: Validate Playwright configuration and discover the certification test
        run: npm run test:list
        working-directory: e2e/browserstack

  iphone-safari:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: readonly-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [core, costs]
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      ERP_E2E_USERNAME: ${{ secrets.ERP_E2E_USERNAME }}
      ERP_E2E_PASSWORD: ${{ secrets.ERP_E2E_PASSWORD }}
      ERP_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || 'https://admin.exportmca.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/browserstack/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e/browserstack
      - name: Confirm required secrets without printing them
        shell: bash
        run: |
          missing=0
          for name in BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY ERP_E2E_USERNAME ERP_E2E_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Wait for the matching production deployment
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                per_page: 30
              });
              for (const deployment of deployments) {
                if (!String(deployment.environment || '').toLowerCase().includes('production')) continue;
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 30
                });
                const current = statuses[0];
                if (current?.state === 'success') {
                  core.info(`Production deployment ${deployment.id} is ready for ${context.sha}`);
                  return;
                }
                if (['error', 'failure', 'inactive'].includes(current?.state)) {
                  throw new Error(`Production deployment ${deployment.id} ended as ${current.state}`);
                }
              }
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            throw new Error(`Timed out waiting for the production deployment of ${context.sha}`);
      - name: Run ${{ matrix.scope }} read-only certification on real iPhone Safari
        run: npm run test:ios:${{ matrix.scope }}
        working-directory: e2e/browserstack
