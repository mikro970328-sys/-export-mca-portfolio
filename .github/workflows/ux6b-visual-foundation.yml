name: UX7 Shell Visual Owner

on:
  pull_request:
    paths:
      - 'admin/index.html'
      - 'admin/pwa.html'
      - 'admin/manifest.webmanifest'
      - 'sw.js'
      - 'admin/erp.js'
      - 'admin/platform-theme.css'
      - 'admin/navigation-shell.css'
      - 'admin/navigation-shell.js'
      - 'admin/dashboard-executive.css'
      - 'admin/dashboard-operational-state.js'
      - 'scripts/check-ux6b-visual-foundation.mjs'
      - 'scripts/check-ux6-shell-ownership.mjs'
      - 'scripts/check-executive-dashboard.mjs'
      - '.github/workflows/ux6b-visual-foundation.yml'
  workflow_dispatch:

jobs:
  validate-visual-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate the UX-7 shell visual owner
        run: node scripts/check-ux6b-visual-foundation.mjs
      - name: Preserve shell and dashboard owners
        run: |
          node scripts/check-ux6-shell-ownership.mjs
          node scripts/check-executive-dashboard.mjs
          node scripts/check-frontend-ownership.mjs
          node scripts/check-admin-shell-resilience.mjs
          node scripts/check-access-control.mjs
      - name: Preserve security boundaries
        run: |
          node scripts/audit-b9-api-boundaries.mjs
          node scripts/check-b9-public-boundaries.mjs
          node scripts/check-integrations.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/erp.js
          node --check admin/navigation-shell.js
          node --check admin/dashboard-operational-state.js
          node --check sw.js
          node --check scripts/check-ux6b-visual-foundation.mjs
          node --check scripts/check-ux6-shell-ownership.mjs
          node --check scripts/check-executive-dashboard.mjs
