name: Frontend Ownership Check

on:
  pull_request:
    paths:
      - 'admin/clients-module.js'
      - 'admin/containers-module.js'
      - 'admin/shipment-editor.js'
      - 'admin/registration-form-shell.js'
      - 'admin/modal-dismissal.js'
      - 'admin/expedientes-module.js'
      - 'admin/dashboard-operational-state.js'
      - 'api/dashboard.js'
      - 'api/importers.js'
      - 'admin/navigation-shell.js'
      - 'admin/navigation-shell.css'
      - 'admin/section-state.js'
      - 'admin/erp.js'
      - 'admin/index.html'
      - 'admin/operational-alert-center.js'
      - 'admin/client-extra-fields.js'
      - 'admin/client-actions-menu.js'
      - 'admin/mobile-interaction-core.js'
      - 'admin/sales.html'
      - 'admin/sales-supply-workspace.js'
      - 'admin/sales-supply-workspace.css'
      - 'api/sales-supply.js'
      - 'api/direct-shipment-dispatch.js'
      - 'supabase/migrations/20260830053000_p1_direct_shipment_dispatch_lifecycle.sql'
      - 'scripts/check-frontend-ownership.mjs'
      - 'scripts/check-shipment-importer-independence.mjs'
      - 'scripts/check-sales-supply-workspace.mjs'
      - '.github/workflows/frontend-ownership-check.yml'
  workflow_dispatch:

jobs:
  validate-frontend-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend ownership and UX-A/UX-B/UX-C
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate UX-E5 shipment importer independence
        run: node scripts/check-shipment-importer-independence.mjs
      - name: Validate P1 sales supply workspace
        run: node scripts/check-sales-supply-workspace.mjs
      - name: Validate P1 JavaScript syntax
        run: |
          node --check admin/sales-supply-workspace.js
          node --check api/sales-supply.js
          node --check api/direct-shipment-dispatch.js
