name: Frontend Ownership Check

on:
  pull_request:
    paths:
      - 'admin/clients-module.js'
      - 'admin/containers-module.js'
      - 'admin/shipment-editor.js'
      - 'admin/registration-form-shell.js'
      - 'admin/modal-dismissal.js'
      - 'admin/expedientes-module.js'
      - 'admin/dashboard-operational-state.js'
      - 'api/dashboard.js'
      - 'api/importers.js'
      - 'admin/navigation-shell.js'
      - 'admin/navigation-shell.css'
      - 'admin/section-state.js'
      - 'admin/erp.js'
      - 'admin/index.html'
      - 'admin/operational-alert-center.js'
      - 'admin/client-extra-fields.js'
      - 'admin/client-actions-menu.js'
      - 'admin/mobile-interaction-core.js'
      - 'admin/sales.html'
      - 'admin/sales-supply-workspace.js'
      - 'admin/sales-supply-workspace.css'
      - 'api/sales-supply.js'
      - 'api/direct-shipment-dispatch.js'
      - 'supabase/migrations/20260830053000_p1_direct_shipment_dispatch_lifecycle.sql'
      - 'admin/sales-customer-finance.js'
      - 'admin/sales-customer-finance.css'
      - 'api/customer-advances.js'
      - 'api/proformas.js'
      - 'supabase/migrations/20260830054000_p2_customer_advances_proformas.sql'
      - 'supabase/migrations/20260830054800_p2_customer_financial_integrity.sql'
      - 'supabase/migrations/20260830055500_p2_fk_index_hardening.sql'
      - 'api/**'
      - 'admin/account-administration.js'
      - 'admin/access-control-administration.js'
      - 'admin/access-control.css'
      - 'supabase/migrations/20260830090500_p3_access_control_foundation.sql'
      - 'supabase/migrations/20260830092000_p3_access_control_setters.sql'
      - 'scripts/check-frontend-ownership.mjs'
      - 'scripts/check-shipment-importer-independence.mjs'
      - 'scripts/check-sales-supply-workspace.mjs'
      - 'scripts/check-sales-customer-finance.mjs'
      - 'scripts/check-access-control.mjs'
      - '.github/workflows/frontend-ownership-check.yml'
  workflow_dispatch:

jobs:
  validate-frontend-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend ownership and UX-A/UX-B/UX-C
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate UX-E5 shipment importer independence
        run: node scripts/check-shipment-importer-independence.mjs
      - name: Validate P1 sales supply workspace
        run: node scripts/check-sales-supply-workspace.mjs
      - name: Validate P1 JavaScript syntax
        run: |
          node --check admin/sales-supply-workspace.js
          node --check api/sales-supply.js
          node --check api/direct-shipment-dispatch.js
      - name: Validate P2 customer advances and Proformas
        run: node scripts/check-sales-customer-finance.mjs
      - name: Validate P2 JavaScript syntax
        run: |
          node --check admin/sales-customer-finance.js
          node --check api/customer-advances.js
          node --check api/proformas.js
      - name: Validate P3 access control
        run: node scripts/check-access-control.mjs
      - name: Validate P3 JavaScript syntax
        run: |
          node --check api/_lib.js
          node --check api/account.js
          node --check api/admins.js
          node --check api/access-control.js
          node --check api/history.js
          node --check admin/access-control-administration.js
          node --check admin/account-administration.js
          node --check admin/erp.js
          node --check admin/navigation-shell.js
          node --check admin/operational-alert-center.js
