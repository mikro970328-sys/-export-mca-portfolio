name: Frontend Ownership Check

on:
  pull_request:
    paths:
      - 'admin/clients-module.js'
      - 'admin/containers-module.js'
      - 'admin/containers-module.css'
      - 'admin/shipment-editor.js'
      - 'admin/shipment-editor.css'
      - 'admin/registration-form-shell.js'
      - 'admin/modal-dismissal.js'
      - 'admin/expedientes-module.js'
      - 'admin/dashboard-operational-state.js'
      - 'admin/dashboard-executive.css'
      - 'api/dashboard.js'
      - 'api/_executive-dashboard.js'
      - 'api/importers.js'
      - 'admin/navigation-shell.js'
      - 'admin/navigation-shell.css'
      - 'admin/section-state.js'
      - 'admin/erp.js'
      - 'admin/index.html'
      - 'admin/admin-shell-runtime.js'
      - 'admin/operational-alert-center.js'
      - 'admin/alert-phase2-stability.js'
      - 'admin/notification-inbox.js'
      - 'admin/notification-inbox.css'
      - 'admin/client-extra-fields.js'
      - 'admin/client-actions-menu.js'
      - 'admin/mobile-interaction-core.js'
      - 'admin/sales.html'
      - 'admin/sales-workspace.js'
      - 'admin/sales-supply-workspace.js'
      - 'admin/sales-supply-workspace.css'
      - 'api/sales-workspace.js'
      - 'api/sales-supply.js'
      - 'api/direct-shipment-dispatch.js'
      - 'supabase/migrations/20260830053000_p1_direct_shipment_dispatch_lifecycle.sql'
      - 'admin/sales-customer-finance.js'
      - 'admin/sales-customer-finance.css'
      - 'api/customer-advances.js'
      - 'api/proformas.js'
      - 'supabase/migrations/20260830054000_p2_customer_advances_proformas.sql'
      - 'supabase/migrations/20260830054800_p2_customer_financial_integrity.sql'
      - 'supabase/migrations/20260830055500_p2_fk_index_hardening.sql'
      - 'api/**'
      - 'admin/account-administration.js'
      - 'admin/access-control-administration.js'
      - 'admin/access-control.css'
      - 'supabase/migrations/20260830090500_p3_access_control_foundation.sql'
      - 'supabase/migrations/20260830092000_p3_access_control_setters.sql'
      - 'api/tasks.js'
      - 'admin/tasks-workspace.js'
      - 'admin/tasks-workspace.css'
      - 'admin/tasks-navigation.js'
      - 'supabase/migrations/20260830154000_p4_task_engine.sql'
      - 'supabase/migrations/20260830160500_p4_task_engine_index_hardening.sql'
      - 'supabase/migrations/20260830161000_p4_task_dependency_completion_guard.sql'
      - 'api/workflow-routes.js'
      - 'admin/workflow-route-settings.js'
      - 'admin/workflow-route-settings.css'
      - 'supabase/migrations/20260830170000_p5_workflow_routing_foundation.sql'
      - 'supabase/migrations/20260830172000_p5_workflow_handoff_rules.sql'
      - 'supabase/migrations/20260830174500_p5_workflow_dependency_integrity.sql'
      - 'admin/operational-navigation.js'
      - 'admin/operational-context-bridge.js'
      - 'api/operational-links.js'
      - 'api/shipment-documents.js'
      - 'api/shipment-document-readiness.js'
      - 'supabase/migrations/20260830183000_p7_cuba_document_version_lifecycle.sql'
      - 'supabase/migrations/20260830183500_p7_cuba_document_version_rpc_fix.sql'
      - 'api/task-supervisor-queue.js'
      - 'admin/task-supervisor-queue.js'
      - 'admin/task-supervisor-queue.css'
      - 'supabase/migrations/20260830203500_p8_operational_task_attention.sql'
      - 'api/_alert-lifecycle.js'
      - 'api/tracking-alerts.js'
      - 'api/manual-tracking-alerts.js'
      - 'api/discharge-release-alerts.js'
      - 'api/stagnant-shipment-alerts.js'
      - 'api/history.js'
      - 'supabase/migrations/20260830211500_p9_operational_alert_condition_registry.sql'
      - 'api/notification-inbox.js'
      - 'api/notification-reconcile.js'
      - 'supabase/migrations/20260830215500_p10_user_notification_inbox.sql'
      - 'supabase/migrations/20260830220500_p10_notification_source_version_integrity.sql'
      - 'supabase/migrations/20260830223000_p11_executive_dashboard_profitability.sql'
      - 'api/reports.js'
      - 'admin/reports.html'
      - 'admin/reports.js'
      - 'admin/reports.css'
      - 'supabase/migrations/20260830225000_p12_executive_report_datasets.sql'
      - 'vercel.json'
      - 'scripts/check-frontend-ownership.mjs'
      - 'scripts/check-ux7-tracking-visual-owner.mjs'
      - 'scripts/check-shipment-importer-independence.mjs'
      - 'scripts/check-sales-supply-workspace.mjs'
      - 'scripts/check-sales-customer-finance.mjs'
      - 'scripts/check-access-control.mjs'
      - 'scripts/check-task-engine.mjs'
      - 'scripts/check-workflow-handoffs.mjs'
      - 'scripts/check-contextual-sync.mjs'
      - 'scripts/check-cuba-documentation.mjs'
      - 'scripts/check-operational-queues.mjs'
      - 'scripts/check-operational-alert-lifecycle.mjs'
      - 'scripts/check-user-notifications.mjs'
      - 'scripts/check-executive-dashboard.mjs'
      - 'scripts/check-executive-reports.mjs'
      - '.github/workflows/frontend-ownership-check.yml'
  workflow_dispatch:

jobs:
  validate-frontend-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend ownership and UX-A/UX-B/UX-C
        run: node scripts/check-frontend-ownership.mjs
      - name: Validate UX-7 Tracking visual owner
        run: node scripts/check-ux7-tracking-visual-owner.mjs
      - name: Validate UX-E5 shipment importer independence
        run: node scripts/check-shipment-importer-independence.mjs
      - name: Validate P1 sales supply workspace
        run: node scripts/check-sales-supply-workspace.mjs
      - name: Validate P1 JavaScript syntax
        run: |
          node --check admin/sales-supply-workspace.js
          node --check api/sales-supply.js
          node --check api/direct-shipment-dispatch.js
      - name: Validate P2 customer advances and Proformas
        run: node scripts/check-sales-customer-finance.mjs
      - name: Validate P2 JavaScript syntax
        run: |
          node --check admin/sales-customer-finance.js
          node --check api/customer-advances.js
          node --check api/proformas.js
      - name: Validate P3 access control
        run: node scripts/check-access-control.mjs
      - name: Validate P3 JavaScript syntax
        run: |
          node --check api/_lib.js
          node --check api/account.js
          node --check api/admins.js
          node --check api/access-control.js
          node --check api/history.js
          node --check admin/access-control-administration.js
          node --check admin/account-administration.js
          node --check admin/erp.js
          node --check admin/navigation-shell.js
          node --check admin/operational-alert-center.js
      - name: Validate P4 task engine
        run: node scripts/check-task-engine.mjs
      - name: Validate P4 JavaScript syntax
        run: |
          node --check api/tasks.js
          node --check admin/tasks-workspace.js
          node --check admin/tasks-navigation.js
      - name: Validate P5 workflow handoffs
        run: node scripts/check-workflow-handoffs.mjs
      - name: Validate P5 JavaScript syntax
        run: |
          node --check api/workflow-routes.js
          node --check admin/workflow-route-settings.js
      - name: Validate P6 contextual sync
        run: node scripts/check-contextual-sync.mjs
      - name: Validate P6 JavaScript syntax
        run: |
          node --check admin/operational-navigation.js
          node --check admin/operational-context-bridge.js
          node --check admin/tasks-navigation.js
          node --check api/operational-links.js
      - name: Validate P7 Cuba documentation
        run: node scripts/check-cuba-documentation.mjs
      - name: Validate P7 JavaScript syntax
        run: |
          node --check admin/containers-module.js
          node --check api/shipment-documents.js
          node --check api/shipment-document-readiness.js
          node --check api/sales-workspace.js
      - name: Validate P8 operational queues
        run: node scripts/check-operational-queues.mjs
      - name: Validate P8 JavaScript syntax
        run: |
          node --check api/task-supervisor-queue.js
          node --check admin/task-supervisor-queue.js
          node --check admin/erp.js
      - name: Validate P9 operational alert lifecycle
        run: node scripts/check-operational-alert-lifecycle.mjs
      - name: Validate P9 JavaScript syntax
        run: |
          node --check api/_alert-lifecycle.js
          node --check api/tracking-alerts.js
          node --check api/manual-tracking-alerts.js
          node --check api/discharge-release-alerts.js
          node --check api/stagnant-shipment-alerts.js
          node --check api/history.js
          node --check admin/operational-alert-center.js
          node --check admin/alert-phase2-stability.js
      - name: Validate P10 user notifications
        run: node scripts/check-user-notifications.mjs
      - name: Validate P10 JavaScript syntax
        run: |
          node --check api/notification-inbox.js
          node --check api/notification-reconcile.js
          node --check admin/notification-inbox.js
          node --check admin/erp.js
      - name: Validate P11 executive dashboard
        run: node scripts/check-executive-dashboard.mjs
      - name: Validate P11 JavaScript syntax
        run: |
          node --check api/dashboard.js
          node --check api/_executive-dashboard.js
          node --check admin/dashboard-operational-state.js
          node --check admin/erp.js
      - name: Validate P12 executive reports
        run: node scripts/check-executive-reports.mjs
      - name: Validate P12 JavaScript syntax
        run: |
          node --check api/reports.js
          node --check admin/reports.js
          node --check admin/navigation-shell.js
