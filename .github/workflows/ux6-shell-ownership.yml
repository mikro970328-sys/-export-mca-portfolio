name: UX6 Shell Ownership

on:
  pull_request:
    paths:
      - 'admin/index.html'
      - 'admin/erp.js'
      - 'admin/admin-shell-runtime.js'
      - 'admin/admin-data-loader.js'
      - 'admin/access-control-administration.js'
      - 'admin/account-administration.js'
      - 'admin/navigation-shell.css'
      - 'admin/workers.html'
      - 'scripts/check-ux6-shell-ownership.mjs'
      - 'scripts/check-frontend-ownership.mjs'
      - 'scripts/check-ux6-account-presentation.mjs'
      - 'scripts/check-ux6-retired-client-legacy.mjs'
      - 'scripts/check-access-control.mjs'
      - '.github/workflows/ux6-shell-ownership.yml'
  workflow_dispatch:

jobs:
  validate-shell-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate final shell ownership
        run: node scripts/check-ux6-shell-ownership.mjs
      - name: Validate affected UX-6 owners
        run: |
          node scripts/check-ux6-account-presentation.mjs
          node scripts/check-ux6-retired-client-legacy.mjs
          node scripts/check-ux6-workers-presentation.mjs
      - name: Validate shared ownership and resilience
        run: |
          node scripts/check-frontend-ownership.mjs
          node scripts/check-admin-shell-resilience.mjs
          node scripts/check-access-control.mjs
          node scripts/check-session-audit-hardening.mjs
      - name: Validate security boundaries
        run: |
          node scripts/audit-b9-api-boundaries.mjs
          node scripts/check-b9-database-privileges.mjs
          node scripts/check-b9-public-boundaries.mjs
          node scripts/check-integrations.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check admin/admin-shell-runtime.js
          node --check admin/admin-data-loader.js
          node --check admin/erp.js
          node --check admin/access-control-administration.js
          node --check admin/account-administration.js
          node --check scripts/check-ux6-shell-ownership.mjs
          node --check scripts/check-frontend-ownership.mjs
          node --check scripts/check-ux6-account-presentation.mjs
          node --check scripts/check-ux6-retired-client-legacy.mjs
          node --check scripts/check-access-control.mjs
