name: UX6 Retired Client Legacy

on:
  pull_request:
    paths:
      - 'admin/index.html'
      - 'admin/clients-module.js'
      - 'scripts/check-ux6-retired-client-legacy.mjs'
      - '.github/workflows/ux6-retired-client-legacy.yml'
  workflow_dispatch:

jobs:
  validate-retired-client-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-ux6-retired-client-legacy.mjs
      - run: node scripts/check-ux6-clients-owner.mjs
      - run: node scripts/check-frontend-ownership.mjs
      - run: node scripts/check-integrations.mjs
      - run: node scripts/check-admin-shell-resilience.mjs
      - name: Validate gate syntax
        run: node --check scripts/check-ux6-retired-client-legacy.mjs
